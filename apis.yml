aid: teliax

name: Teliax

description: 'Teliax is a wholesale and carrier-grade telecommunications provider that now operates as Ringer Network Solutions: www.teliax.com
  redirects to ringer.tel, whose homepage lists ''Ringer Network Solutions (formerly Teliax) - Wholesale and carrier-grade services'' alongside
  Ringer Business (formerly Leap Telecom) and Ringer Mobile. Products include SIP trunking, wholesale voice, toll-free services, access homing
  tandem, hosted PBX, MS Teams integration, private-label CPaaS and TeliQue telecom data services, with developer documentation for Ringer APIs
  (TeliQue, TNIQ, WARP) at docs.ringer.tel and the ringer-oapi repository in the Teliax Inc. GitHub organization.'

