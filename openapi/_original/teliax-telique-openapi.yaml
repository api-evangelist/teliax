openapi: 3.0.3
info:
  title: Telique Telecom API
  version: 2026.6.25
  description: |-
    Unified Telique telecom data API. Consolidated from 4 services: lrn, cnam, lerg, routelink.

    Get your API token at [telique.ringer.tel](https://telique.ringer.tel).
  contact:
    name: Ringer Support
    email: support@ringer.com
    url: https://telique.ringer.tel
  license:
    name: Proprietary
servers:
  - url: https://api.telique.ringer.tel
    description: Production
security:
  - apiToken: []
tags:
  - name: LRN
    description: Local Routing Number lookups — resolve a phone number to the switch that currently serves it, with porting
      metadata.
  - name: CNAM
    description: Caller Name lookups and Robocall Mitigation scoring via TransUnion TruContact.
  - name: LERG
    description: LERG telecom routing data — table metadata, NPA-NXX lookups, switch data, tandem relationships, and complex
      cross-table queries.
  - name: RouteLink
    description: Toll-free number routing — CIC lookups, ROR lookups, and CPR inspection.
  - name: DNO
    description: Do Not Originate checks — determine whether a phone number is flagged as one that should never appear as a
      caller ID.
  - name: LERG GraphQL
    description: GraphQL interface for flexible LERG data queries with field selection, filtering, pagination, nested
      relationships, and dynamic joins.
  - name: LSMS
    description: LSMS database queries — relationship lookups across phone numbers, LRNs, SPIDs, and service providers via
      REST or GraphQL.
paths:
  /v1/telique/lrn/{phone_number}:
    get:
      operationId: lrnLookupByPath
      tags:
        - LRN
      summary: Look up the LRN for a phone number (GET)
      description: |
        Simple GET-based LRN lookup. Default response is plain text
        `LRN;SPID` (semicolon-separated, **not** pipe) for ported numbers,
        or just the dialed number echoed back as its own LRN for unported
        numbers. Use the `format` query parameter for JSON or XML.

        Examples:
        - `/v1/telique/lrn/3036298301` returns `7207081999;567G`
        - `/v1/telique/lrn/3036298301?format=json` returns JSON

        **Accepted input — geographic/wireless NANP numbers only.** This
        endpoint resolves numbers carried in LSMS/NPAC porting data. It does
        **not** service toll-free numbers (NPAs 800, 833, 844, 855, 866, 877,
        888, 822) — for toll-free routing use the RouteLink endpoints
        (`/v1/telique/ror/{crn}`, `/v1/telique/cicror/...`).

        **Unported, unknown, toll-free, and non-LERG-assigned numbers all
        return the dialed number as its own LRN** (plain text = the number
        itself; JSON `lrn` = the number, `metadata.spid` = null), HTTP `200`.
        The endpoint does **not** validate that the NPA-NXX is LERG-assigned
        and does **not** distinguish "valid unported number" from "toll-free /
        non-routable" — both yield this echo response. Callers should
        pre-filter toll-free and non-geographic NPAs before dipping to avoid
        wasted lookups. A `400 INVALID_PHONE_NUMBER` is returned **only** for
        malformed input (not a 10-digit NANP number after normalization).
      parameters:
        - name: phone_number
          in: path
          required: true
          description: 10-digit US phone number
          schema:
            type: string
            pattern: ^\d{10}$
            example: "3036298301"
        - name: format
          in: query
          required: false
          description: Response format (default is plain text)
          schema:
            type: string
            enum:
              - json
              - xml
              - plain
              - raw
            default: plain
      responses:
        "200":
          description: LRN found
          content:
            text/plain:
              schema:
                type: string
              example: 7207081999;567G
            application/json:
              schema:
                $ref: "#/components/schemas/LrnLookupResponse"
              example:
                phone_number: "3036298301"
                lrn: "7207081999"
                status: success
                timestamp: 2026-04-04T23:04:50.391142767Z
                metadata:
                  spid: 567G
                  lnp_type: lspp
        "400":
          description: Malformed input — the path value is not a 10-digit NANP number after normalization (wrong length, NPA/NXX
            starting with 0/1, or non-numeric). Returned as a JSON error body even though successful lookups default to
            plain text. Toll-free and non-LERG numbers do NOT 400 — they return `200` with the number echoed as its own
            LRN (see the endpoint description).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: INVALID_PHONE_NUMBER
                message: "Invalid phone number format: Invalid format: notanumber. Expected 10-digit US number or E.164 format."
                code: 400
                timestamp: 2026-04-04T23:04:50.391142767Z
        "404":
          description: Not returned for well-formed input — an unported/unknown number yields `200` with the number echoed as its
            own LRN, not a 404. This status is reserved for an explicit data-store "not found" signal that the current
            implementation does not emit. JSON error body if it ever occurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Data store unavailable. JSON error body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: DATA_STORE_UNAVAILABLE
                message: Data store is temporarily unavailable
                code: 503
                timestamp: 2026-04-04T23:04:50.391142767Z
  /v1/telique/dno/{phone_number}:
    get:
      operationId: dnoCheck
      tags:
        - DNO
      summary: Check if a phone number is Do Not Originate
      description: |
        Returns whether the phone number appears on the Do Not Originate list.
        Default response is plain text `true` or `false`. Use the `format`
        query parameter for JSON (which includes match details when DNO).

        Supports prefix matching — the DNO list contains 3, 6, 7, and
        10-digit patterns. A 10-digit lookup matches against all prefix lengths.
      parameters:
        - name: phone_number
          in: path
          required: true
          description: 10-digit US phone number
          schema:
            type: string
            pattern: ^\d{10}$
            example: "8008291040"
        - name: format
          in: query
          required: false
          description: Response format (default is plain text)
          schema:
            type: string
            enum:
              - json
              - xml
              - raw
            default: raw
      responses:
        "200":
          description: DNO check completed
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
              example: "true"
            application/json:
              schema:
                $ref: "#/components/schemas/DnoLookupResponse"
              example:
                phone_number: "8008291040"
                is_dno: true
                status: success
                timestamp: 2026-04-04T23:05:01.706505032Z
                source: ITG
                created_at: 2022-10-12T07:44:48Z
                matched_pattern: "8008291040"
  /v1/telique/lsms/list/phone_number:
    get:
      operationId: lsmsListPhoneNumbers
      tags:
        - LSMS
      summary: List phone numbers by LRN or SPID
      description: |
        Query the LSMS database for all phone numbers associated with a
        given LRN or SPID. Exactly one query parameter must be provided.

        These endpoints query PostgreSQL directly and may have higher
        latency than the primary LRN lookup endpoints.
      parameters:
        - name: lrn
          in: query
          required: false
          description: Local Routing Number to filter by (10-digit)
          schema:
            type: string
            pattern: ^\d{10}$
            example: "7207081999"
        - name: spid
          in: query
          required: false
          description: Service Provider ID to filter by (4 characters)
          schema:
            type: string
            pattern: ^[A-Z0-9]{4}$
            example: 567G
      responses:
        "200":
          description: List of phone numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneNumberListResponse"
              example:
                count: 3
                phone_numbers:
                  - "3036298301"
                  - "3036298302"
                  - "3036298303"
                query:
                  lrn: "7207081999"
        "400":
          description: Invalid parameters (must provide exactly one of lrn or spid)
  /v1/telique/lsms/list/spid:
    get:
      operationId: lsmsListSpids
      tags:
        - LSMS
      summary: List SPIDs by LRN or phone number
      description: |
        Query the LSMS database for all Service Provider IDs associated with
        a given LRN or phone number. Exactly one query parameter must be provided.
      parameters:
        - name: lrn
          in: query
          required: false
          description: Local Routing Number to filter by (10-digit)
          schema:
            type: string
            pattern: ^\d{10}$
            example: "7207081999"
        - name: phone_number
          in: query
          required: false
          description: Phone number to filter by (10-digit)
          schema:
            type: string
            pattern: ^\d{10}$
            example: "3036298301"
      responses:
        "200":
          description: List of SPIDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpidListResponse"
              example:
                count: 1
                spids:
                  - 567G
                query:
                  lrn: "7207081999"
        "400":
          description: Invalid parameters (must provide exactly one of lrn or phone_number)
  /v1/telique/lsms/list/lrn:
    get:
      operationId: lsmsListLrns
      tags:
        - LSMS
      summary: List LRNs by SPID or phone number
      description: |
        Query the LSMS database for all Local Routing Numbers associated with
        a given SPID or phone number. Exactly one query parameter must be provided.
      parameters:
        - name: spid
          in: query
          required: false
          description: Service Provider ID to filter by (4 characters)
          schema:
            type: string
            pattern: ^[A-Z0-9]{4}$
            example: 567G
        - name: phone_number
          in: query
          required: false
          description: Phone number to filter by (10-digit)
          schema:
            type: string
            pattern: ^\d{10}$
            example: "3036298301"
      responses:
        "200":
          description: List of LRNs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LrnListResponse"
              example:
                count: 2
                lrns:
                  - "7207081999"
                  - "3036298300"
                query:
                  spid: 567G
        "400":
          description: Invalid parameters (must provide exactly one of spid or phone_number)
  /v1/telique/lsms/gql:
    post:
      operationId: lsmsGraphql
      tags:
        - LSMS
      summary: Query LSMS data via GraphQL
      description: |
        GraphQL endpoint for flexible LSMS database queries. Supports
        subscription version lookups, number block queries, service provider
        information, and NPA-NXX data.

        Available root queries:
        - `subscriptionVersion(phoneNumber)` — single phone number lookup
        - `subscriptionVersionsByLrn(lrn, limit, offset)` — paginated list by LRN
        - `subscriptionVersionsBySpid(spid, limit, offset)` — paginated list by SPID
        - `numberBlock(npanxxx)` — NPA-NXX-X block details
        - `numberBlocks(spid, lrn, limit, offset)` — paginated block search
        - `serviceProvider(spid, npacRegion)` — provider details
        - `serviceProviders(limit, offset)` — list all providers
        - `locationRoutingNumber(lrn)` — LRN details
        - `npanxx(npa, nxx)` — NPA-NXX assignment info
        - `npanxxBySpid(spid, limit, offset)` — NPA-NXX assignments by SPID
        - `lsmsStats` — database statistics

        Visit the GraphQL playground (GET request to the same path) for
        interactive schema exploration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: GraphQL query string
                variables:
                  type: object
                  description: Query variables
            example:
              query: |
                {
                  subscriptionVersion(phoneNumber: "3036298301") {
                    phoneNumber
                    lrn
                    spid
                    lnpType
                    activationTimestamp
                    isActive
                  }
                }
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object
              example:
                data:
                  subscriptionVersion:
                    phoneNumber: "3036298301"
                    lrn: "7207081999"
                    spid: 567G
                    lnpType: lspp
                    activationTimestamp: 2026-04-04T23:04:50.386843345Z
                    isActive: true
  /v1/telique/cnam/{phoneNumber}:
    get:
      operationId: cnamLookup
      tags:
        - CNAM
      summary: Simplified CNAM lookup by phone number
      description: |
        Look up the registered caller name for a phone number. This is a convenience
        endpoint that only requires the phone number in the URL path.

        Internally, the phone number is used as the `calling_party` and a placeholder
        value is injected for `called_party`. For full control over both parties and
        robocall mitigation scoring, use the `/v1/telique/cnam/identity` endpoint instead.
      parameters:
        - name: phoneNumber
          in: path
          required: true
          description: NANP phone number to look up. Accepts 10 digits (`5714345400`), 11 digits with a leading 1 (`15714345400`),
            or E.164 with leading `+1` (`+15714345400`). No dashes or spaces.
          schema:
            type: string
            pattern: ^(\+?1)?\d{10}$
            example: "5714345400"
        - name: nocache
          in: query
          required: false
          description: "When present (any value, including empty), bypasses the cache and fetches a fresh result from TransUnion.
            Successful (`status: ok`) responses are written back to the cache."
          schema:
            type: string
          allowEmptyValue: true
      responses:
        "200":
          description: Successful CNAM lookup
          headers:
            X-Cache:
              description: Cache status — `HIT` (served from cache), `MISS` (fetched from TransUnion and cached), or `BYPASS` (nocache
                was used)
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
                  - BYPASS
            Cache-Control:
              description: Always `no-store` to prevent CDN and browser caching
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamResponse"
              examples:
                nameAvailable:
                  summary: Caller name found
                  value:
                    status: ok
                    cnam:
                      calling_name_status: available
                      calling_name: WIRELESS CALLER
                      presentation_indicator: allowed
                nameUnavailable:
                  summary: No caller name on file
                  value:
                    status: ok
                    cnam:
                      calling_name_status: unavailable
        "400":
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              example:
                error: bad request
                message: invalid phone number
        "502":
          description: TransUnion upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              example:
                error: upstream error
                message: TransUnion request failed
  /v1/telique/cnam/identity:
    get:
      operationId: identityLookupGet
      tags:
        - CNAM
      summary: Full identity lookup (CNAM + Robocall Mitigation) via query parameters
      description: |
        Full CNAM and Robocall Mitigation lookup using query parameters. Both `calling_party`
        and `called_party` are required.

        Optionally include STIR/SHAKEN attestation fields (`verstat`, `attest`) to receive
        enhanced robocall risk scoring via TransUnion's TruContact engine.

        For requests that include nested `cv_data`, use the POST variant instead.
      parameters:
        - name: calling_party
          in: query
          required: false
          description: "Originating phone number — the number whose caller name is looked up. Optional: omitting it yields a
            less-useful result. Format is validated by the upstream (TransUnion); invalid numbers are returned as a
            non-ok status."
          schema:
            type: string
            pattern: ^(\+?1)?\d{10}$
            example: "5714345400"
        - name: called_party
          in: query
          required: true
          description: Destination NANP phone number. Accepts 10 digits, 11 digits with a leading 1, or E.164 with a leading `+1`.
          schema:
            type: string
            pattern: ^(\+?1)?\d{10}$
            example: "3034298788"
        - name: call_direction
          in: query
          required: false
          description: Direction of the call
          schema:
            type: string
            enum:
              - incoming
              - outgoing
            example: incoming
        - name: txn_id
          in: query
          required: false
          description: Your transaction ID, echoed back in the response
          schema:
            type: string
            example: txn-20260404-001
        - name: client_id
          in: query
          required: false
          description: Your client identifier (up to 32 alphanumeric characters)
          schema:
            type: string
            maxLength: 32
            example: telique-prod
        - name: verstat
          in: query
          required: false
          description: STIR/SHAKEN verification status
          schema:
            type: string
            example: TN-Validation-Passed
        - name: attest
          in: query
          required: false
          description: STIR/SHAKEN attestation level
          schema:
            type: string
            enum:
              - A
              - B
              - C
            example: A
        - name: nocache
          in: query
          required: false
          description: "When present (any value, including empty), bypasses the cache and fetches a fresh result from TransUnion.
            Successful (`status: ok`) responses are written back to the cache."
          schema:
            type: string
          allowEmptyValue: true
      responses:
        "200":
          description: Successful identity lookup
          headers:
            X-Cache:
              description: Cache status — `HIT`, `MISS`, or `BYPASS`
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
                  - BYPASS
            Cache-Control:
              description: Always `no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
              examples:
                cnamOnly:
                  summary: Basic CNAM result
                  value:
                    status: ok
                    cnam:
                      calling_name_status: available
                      calling_name: WIRELESS CALLER
                      presentation_indicator: allowed
                withRobocallMitigation:
                  summary: CNAM with robocall risk scoring
                  value:
                    status: ok
                    cnam:
                      calling_name_status: available
                      calling_name: ROBO? Marketing
                      presentation_indicator: allowed
                    call_insight:
                      call_treatment: DENY
                      fraud_score: 100
                      original_calling_name: Marketing Firm
                      propensity: very-high
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              example:
                error: bad request
                message: called_party is required
        "502":
          description: TransUnion upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              example:
                error: upstream error
                message: TransUnion request failed
    post:
      operationId: identityLookupPost
      tags:
        - CNAM
      summary: Full identity lookup (CNAM + Robocall Mitigation) via JSON body
      description: |
        Full CNAM and Robocall Mitigation lookup using a JSON request body. Supports all
        the same fields as the GET variant, plus nested `cv_data` for STIR/SHAKEN
        call-validation data.

        The request body is proxied to TransUnion with the API key injected. The `cv_data`
        object is preserved as-is (not flattened).
      parameters:
        - name: nocache
          in: query
          required: false
          description: "When present (any value, including empty), bypasses the cache and fetches a fresh result from TransUnion.
            Successful (`status: ok`) responses are written back to the cache."
          schema:
            type: string
          allowEmptyValue: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityRequest"
            examples:
              basicLookup:
                summary: Basic identity lookup
                value:
                  calling_party: "5714345400"
                  called_party: "3034298788"
                  call_direction: incoming
              withCvData:
                summary: Lookup with STIR/SHAKEN call-validation data
                value:
                  calling_party: "5714345400"
                  called_party: "3034298788"
                  call_direction: incoming
                  txn_id: txn-20260404-002
                  client_id: telique-prod
                  verstat: TN-Validation-Failed
                  attest: C
                  cv_data:
                    verstat: TN-Validation-Failed
                    attest: C
                    ppt: shaken
                    origid: 1db966a6-8f30-11e7-bc77-fa163e70349d
      responses:
        "200":
          description: Successful identity lookup
          headers:
            X-Cache:
              description: Cache status — `HIT`, `MISS`, or `BYPASS`
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
                  - BYPASS
            Cache-Control:
              description: Always `no-store`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
              examples:
                withCvData:
                  summary: Response with STIR/SHAKEN cv_data echoed
                  value:
                    status: ok
                    cnam:
                      calling_name_status: available
                      calling_name: Fraudulent Call
                      presentation_indicator: allowed
                    call_insight:
                      call_treatment: DENY
                      fraud_score: 100
                      original_calling_name: Marketing firm
                      cv_data:
                        verstat: TN-Validation-Failed
                        attest: C
                        ppt: shaken
                        origid: 1db966a6-8f30-11e7-bc77-fa163e70349d
        "400":
          description: Missing required fields or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    error: bad request
                    message: called_party is required
                invalidJson:
                  summary: Malformed JSON body
                  value:
                    error: bad request
                    message: invalid character 'o' in literal null (expecting 'u')
        "502":
          description: TransUnion upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnamErrorResponse"
              example:
                error: upstream error
                message: TransUnion request failed
  /v1/telique/lerg/tables:
    get:
      operationId: listTables
      tags:
        - LERG
      summary: List all LERG tables
      description: |
        Returns metadata for all 27 LERG tables including record counts and field definitions.
        Useful for discovering available tables and their structures before querying.
      responses:
        "200":
          description: List of all available LERG tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TableInfo"
              example:
                - name: lerg_1
                  display_name: LERG 1
                  record_count: 20447
                  fields:
                    - name: ocn_num
                      display_name: OCN Number
                      data_type: string
                      nullable: true
                    - name: ocn_name
                      display_name: OCN Name
                      data_type: string
                      nullable: true
                - name: lerg_6
                  display_name: LERG 6
                  record_count: 1501514
                  fields:
                    - name: npa
                      display_name: NPA
                      data_type: integer
                      nullable: false
                    - name: nxx
                      display_name: NXX
                      data_type: integer
                      nullable: false
                    - name: block_id
                      display_name: Block ID
                      data_type: string
                      nullable: false
  /v1/telique/lerg/tables/{table_name}:
    get:
      operationId: getTableInfo
      tags:
        - LERG
      summary: Get table metadata
      description: |
        Returns detailed metadata for a specific LERG table, including the full list of
        fields and current record count.
      parameters:
        - name: table_name
          in: path
          required: true
          description: Name of the LERG table. Use `listTables` to see all available table names.
          schema:
            type: string
            enum:
              - lerg_1
              - lerg_1_con
              - lerg_2
              - lerg_3
              - lerg_4
              - lerg_5
              - lerg_6
              - lerg_6_atc
              - lerg_6_ins
              - lerg_6_odd
              - lerg_7
              - lerg_7_ins
              - lerg_7_sha
              - lerg_7_sha_ins
              - lerg_8
              - lerg_8_lir
              - lerg_8_loc
              - lerg_8_pst
              - lerg_9
              - lerg_9_atc
              - lerg10
              - lerg11
              - lerg12
              - lerg12_ins
              - lerg16
              - lerg17
              - lergdate
            example: lerg_6
      responses:
        "200":
          description: Table metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableInfo"
              example:
                name: lerg_6
                display_name: LERG 6
                record_count: 1501514
                fields:
                  - name: npa
                    display_name: NPA
                    data_type: integer
                    nullable: false
                  - name: nxx
                    display_name: NXX
                    data_type: integer
                    nullable: false
                  - name: ocn
                    display_name: OCN
                    data_type: string
                    nullable: true
                  - name: switch
                    display_name: Switch
                    data_type: string
                    nullable: true
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              example:
                error: Table 'invalid_table' not found
                status: 404
  /v1/telique/lerg/tables/{table_name}/schema:
    get:
      operationId: getTableSchema
      tags:
        - LERG
      summary: Get table field definitions
      description: |
        Returns the schema for a specific LERG table including column names, display names,
        data types, and nullability. Use this to understand what fields are available for
        queries and filtering.
      parameters:
        - name: table_name
          in: path
          required: true
          description: Name of the LERG table
          schema:
            type: string
            example: lerg_6
      responses:
        "200":
          description: Table schema information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSchemaResponse"
              example:
                table: lerg_6
                display_name: LERG 6
                fields:
                  - name: npa
                    display_name: NPA
                    data_type: integer
                    nullable: false
                  - name: nxx
                    display_name: NXX
                    data_type: integer
                    nullable: false
                  - name: block_id
                    display_name: Block ID
                    data_type: string
                    nullable: false
                  - name: ocn
                    display_name: OCN
                    data_type: string
                    nullable: true
                  - name: loc_name
                    display_name: Location Name
                    data_type: string
                    nullable: true
                  - name: switch
                    display_name: Switch
                    data_type: string
                    nullable: true
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
  /v1/telique/lerg/fast/lerg_6/{fields}/{query}:
    get:
      operationId: queryLerg6Fast
      tags:
        - LERG
      summary: Ultra-fast LERG 6 lookups
      description: |
        High-performance endpoint specifically optimized for LERG 6 (NPA-NXX) queries.
        Uses pre-computed hash indexes for sub-microsecond lookups on NPA, NXX, OCN,
        SWITCH, LATA, and state fields.

        Best for real-time routing lookups where latency matters.

        ## URL Format
        - `fields`: Comma-separated field names to return, or `*` for all fields
        - `query`: Filter conditions as `key=value` pairs separated by `&`

        ## Indexed Fields
        `npa`+`nxx` (packed), `ocn`, `switch`. Other filters (e.g. `block_id`,
        `lata`, `loc_state`) are applied as post-filters after the index lookup.

        ## Examples
        - All 303 NPAs: `/v1/telique/lerg/fast/lerg_6/npa,nxx,ocn,switch/npa=303`
        - Specific block: `/v1/telique/lerg/fast/lerg_6/*/npa=303&nxx=629&block_id=A`
        - By switch: `/v1/telique/lerg/fast/lerg_6/npa,nxx,ocn/switch=DNVRCOMADS0`
      parameters:
        - name: fields
          in: path
          required: true
          description: Comma-separated list of fields to return, or `*` for all
          schema:
            type: string
            example: npa,nxx,ocn,loc_name,switch
        - name: query
          in: path
          required: true
          description: Filter conditions as key=value pairs separated by &
          schema:
            type: string
            example: npa=720&nxx=708
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 10
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                table: lerg_6
                count: 1
                total_unique: 1
                offset: 0
                limit: 10
                data:
                  - npa: 720
                    nxx: 708
                    ocn: "7167"
                    loc_name: DENVER
                    switch: DNVRCO93DS0
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              example:
                error: "Invalid filter field: invalid_field"
                status: 400
  /v1/telique/lerg/{table_name}/{fields}/{query}:
    get:
      operationId: queryTable
      tags:
        - LERG
      summary: Query any LERG table with filters
      description: |
        Perform dynamic queries on any of the 27 LERG tables with field selection and
        filtering. Filters are applied with AND logic.

        ## URL Format
        - `table_name`: The LERG table to query (e.g., `lerg_6`, `lerg_1`)
        - `fields`: Comma-separated field names to return, or `*` for all fields
        - `query`: Filter conditions as `key=value` pairs separated by `&`

        ## Projection Validation
        Field names in the `fields` segment are validated against the table's schema. Unknown
        field names produce a `400 Bad Request` (with a `did you mean` suggestion when the
        typo is close to a real column). Use `GET /v1/telique/lerg/tables/{table_name}` to
        list valid fields, or pass `*` to select all fields.

        ## Filter Operators
        Filters in the URL path support exact match only. For advanced operators
        (like, in, gt, lt, etc.), use the POST `/query` endpoint.

        ## Examples
        - Denver NPA-NXX data: `/v1/telique/lerg/lerg_6/npa,nxx,loc_name,switch/loc_name=DENVER`
        - All columns via wildcard: `/v1/telique/lerg/lerg_6/*/npa=303&nxx=629`
        - Colorado OCNs: `/v1/telique/lerg/lerg_1/ocn_num,ocn_name,ocn_state/ocn_state=CO`
        - Specific NPA-NXX-Block: `/v1/telique/lerg/lerg_6/lata,ocn,switch/npa=864&nxx=763&block_id=A`
      parameters:
        - name: table_name
          in: path
          required: true
          description: Name of the LERG table to query
          schema:
            type: string
            example: lerg_6
        - name: fields
          in: path
          required: true
          description: Comma-separated list of fields to return, or `*` for all
          schema:
            type: string
            example: npa,nxx,ocn,loc_name,switch
        - name: query
          in: path
          required: true
          description: Filter conditions as key=value pairs separated by &
          schema:
            type: string
            example: npa=720&loc_name=DENVER
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            default: 100
            example: 10
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                table: lerg_6
                count: 3
                total_unique: 3
                data:
                  - npa: 720
                    nxx: 708
                    ocn: "7167"
                    loc_name: DENVER
                    switch: DNVRCO93DS0
                  - npa: 720
                    nxx: 709
                    ocn: "6534"
                    loc_name: DENVER
                    switch: DNVRCOMADS0
                  - npa: 720
                    nxx: 710
                    ocn: "9636"
                    loc_name: DENVER
                    switch: DNVRCOMA02T
        "400":
          description: |
            Invalid query parameters — e.g. an unknown column name in the `fields` path
            segment, or `*` combined with other field names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              example:
                error: "Bad request: unknown field(s) for table `lerg_6`: `category` (did you mean `lata`?). Use GET
                  /v1/telique/lerg/tables/lerg_6 to list valid fields, or `*` to select all."
                status: 400
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              example:
                error: Table 'invalid' not found
                status: 404
  /v1/telique/lerg/query:
    post:
      operationId: complexQuery
      tags:
        - LERG
      summary: Complex query with filters and joins
      description: |
        Execute complex queries using a JSON request body. Supports advanced filter operators,
        cross-table joins, and pagination. Use this when you need operators beyond simple
        equality (like, in, gt, lt, etc.) or need to join data across LERG tables.

        ## Filter Operators
        `eq`, `ne`, `gt`, `gte`, `lt`, `lte`, `like`, `in`, `notin`, `isnull`, `isnotnull`

        ## Join Types
        `inner`, `left`, `right`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplexQueryRequest"
            examples:
              simpleFilter:
                summary: Simple query with filters
                value:
                  table: lerg_6
                  fields:
                    - npa
                    - nxx
                    - loc_name
                    - ocn
                  filters:
                    - field: npa
                      operator: eq
                      value: 720
                    - field: loc_name
                      operator: eq
                      value: DENVER
                  limit: 10
              withJoin:
                summary: Join LERG 6 with LERG 1 to get carrier names
                value:
                  table: lerg_6
                  fields:
                    - npa
                    - nxx
                    - ocn
                    - loc_name
                  filters:
                    - field: npa
                      operator: eq
                      value: 720
                  join:
                    join_type: inner
                    table: lerg_1
                    on:
                      - left_field: ocn
                        right_field: ocn_num
                    fields:
                      - ocn_name
                  limit: 5
              likeFilter:
                summary: Pattern matching with LIKE
                value:
                  table: lerg_1
                  fields:
                    - ocn_num
                    - ocn_name
                    - ocn_state
                  filters:
                    - field: ocn_name
                      operator: like
                      value: BANDWIDTH%
                  limit: 10
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                table: lerg_6
                count: 3
                data:
                  - npa: 720
                    nxx: 708
                    ocn: "7167"
                    loc_name: DENVER
                    ocn_name: CELLCO PARTNERSHIP DBA VERIZON WIRELESS
                joined_with: lerg_1
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              example:
                error: "Invalid filter operator: 'invalid'"
                status: 400
  /v1/telique/lerg/tandem:
    get:
      operationId: queryTandem
      tags:
        - LERG
      summary: Query tandem switch relationships
      description: |
        Performs pre-joined queries across LERG tables to determine tandem switch
        relationships. Returns the carrier, LATA, switch, and tandem for matched records.
        Requires at least one search parameter.

        ## Search Options
        - **NPA + NXX**: Tandem info for a specific area code and exchange
        - **Switch**: Tandem info for a specific switch CLLI code
        - **Tandem**: Reverse lookup — all switches routing through a tandem
        - **Name**: Tandem info for carriers matching a name pattern (supports `%` or `*` wildcards)
      parameters:
        - name: npa
          in: query
          required: false
          description: NPA (area code) — requires `nxx` to also be specified
          schema:
            type: string
            pattern: ^[2-9][0-9]{2}$
            example: "303"
        - name: nxx
          in: query
          required: false
          description: NXX (exchange) — requires `npa` to also be specified
          schema:
            type: string
            pattern: ^[2-9][0-9]{2}$
            example: "629"
        - name: switch
          in: query
          required: false
          description: Switch CLLI code (11 characters)
          schema:
            type: string
            pattern: ^[A-Z0-9]{11}$
            example: DNVRCOMADS0
        - name: tandem
          in: query
          required: false
          description: Tandem CLLI code — returns all switches that route through it
          schema:
            type: string
            pattern: ^[A-Z0-9]{11}$
            example: DNVRCO2630T
        - name: name
          in: query
          required: false
          description: Carrier name pattern (use `%` or `*` for wildcards)
          schema:
            type: string
            example: BANDWIDTH%
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
            example: 100
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
      responses:
        "200":
          description: Tandem query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TandemQueryResponse"
              examples:
                byNpaNxx:
                  summary: Query by NPA-NXX
                  value:
                    count: 1
                    records:
                      - ocn_name: QWEST CORPORATION
                        ocn: "9636"
                        lata: "656"
                        lata_name: DENVER CO
                        state: CO
                        switch: DNVRCOMADS0
                        tandem: DNVRCOMA02T
                        tandem_ocn: "9636"
                        tandem_ocn_name: QWEST CORPORATION
                    query:
                      query_type: npa_nxx
                      limit: 100
                      offset: 0
                byTandem:
                  summary: Reverse lookup by tandem
                  value:
                    count: 2
                    records:
                      - npa: "303"
                        nxx: "629"
                        ocn_name: QWEST CORPORATION
                        ocn: "9636"
                        lata: "656"
                        lata_name: DENVER CO
                        state: CO
                        switch: DNVRCOMADS0
                        tandem: DNVRCO2630T
                        tandem_ocn: 567G
                        tandem_ocn_name: TELIAX, INC. - CO
                      - npa: "206"
                        nxx: "776"
                        ocn_name: FIVE9, INC.
                        ocn: 598J
                        lata: "674"
                        lata_name: SEATTLE WASHINGTON
                        state: WA
                        switch: STTLWAWB39Z
                        tandem: DNVRCO2630T
                        tandem_ocn: 567G
                        tandem_ocn_name: TELIAX, INC. - CO
                    query:
                      query_type: tandem
                      limit: 100
                      offset: 0
        "400":
          description: Invalid or missing query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LergErrorResponse"
              examples:
                missingParams:
                  value:
                    error: At least one search parameter (npa+nxx, switch, tandem, or name) is required
                    status: 400
                npaMissingNxx:
                  value:
                    error: NXX is required when searching by NPA
                    status: 400
  /v1/telique/lerg/graphql:
    get:
      operationId: graphqlPlayground
      tags:
        - LERG GraphQL
      summary: GraphiQL interactive playground
      description: |
        Opens the GraphiQL IDE in your browser for interactive query building and
        schema exploration. The playground provides auto-complete, documentation,
        and query history.
      security: []
      responses:
        "200":
          description: GraphiQL HTML page
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: graphqlQuery
      tags:
        - LERG GraphQL
      summary: Execute a GraphQL query
      description: |
        Execute GraphQL queries against all 27 LERG tables. Supports field selection,
        filtering, pagination, nested relationships, and dynamic cross-table joins.

        ## Available Queries
        One query per LERG table: `lerg1`, `lerg1Con`, `lerg2`, `lerg3`, `lerg4`, `lerg5`,
        `lerg6`, `lerg6Atc`, `lerg6Ins`, `lerg6Odd`, `lerg7`, `lerg7Ins`, `lerg7Sha`,
        `lerg7ShaIns`, `lerg8`, `lerg8Lir`, `lerg8Loc`, `lerg8Pst`, `lerg9`, `lerg9Atc`,
        `lerg10`, `lerg11`, `lerg12`, `lerg12Ins`, `lerg16`, `lerg17`, `lergdate`

        Plus `dynamicJoin` for arbitrary cross-table SQL joins.

        ## Nested Relationships
        - `lerg6.carrier` -> LERG 1 record (via OCN)
        - `lerg6.switchInfo` -> LERG 7 record (via SWITCH)
        - `lerg6.homingArrangements` -> LERG 7 SHA records (via SWITCH)
        - `lerg7.carrier` -> LERG 1 record (via OCN)
        - `lerg7Sha.tandemSwitch` -> LERG 7 record (via tandem CLLI)

        ## Filter Operators
        `EQ`, `NE`, `GT`, `GTE`, `LT`, `LTE`, `LIKE`, `IN`, `IS_NULL`, `IS_NOT_NULL`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: GraphQL query string
                variables:
                  type: object
                  description: GraphQL variables
                  additionalProperties: true
                operationName:
                  type: string
                  description: Name of the operation to execute (if query contains multiple)
            examples:
              simpleQuery:
                summary: Query NPA-NXX data with carrier info
                value:
                  query: |
                    {
                      lerg6(
                        filters: [
                          { field: "npa", op: EQ, value: "720" },
                          { field: "nxx", op: EQ, value: "708" }
                        ]
                        pagination: { limit: 5 }
                      ) {
                        npa
                        nxx
                        blockId
                        ocn
                        locName
                        locState
                        switch
                        carrier {
                          ocnNum
                          ocnName
                        }
                      }
                    }
              carrierSearch:
                summary: Search carriers by state
                value:
                  query: |
                    {
                      lerg1(
                        filters: [{ field: "ocnState", op: EQ, value: "CO" }]
                        pagination: { limit: 10 }
                      ) {
                        ocnNum
                        ocnName
                        ocnState
                        category
                      }
                    }
              dynamicJoin:
                summary: Dynamic join between tables
                value:
                  query: |
                    {
                      dynamicJoin(input: {
                        leftTable: "lerg_6"
                        rightTable: "lerg_1"
                        joinColumns: [{ left: "ocn", right: "ocn_num" }]
                        selectColumns: [
                          { table: "lerg_6", column: "npa" },
                          { table: "lerg_6", column: "nxx" },
                          { table: "lerg_1", column: "ocn_name" }
                        ]
                        filters: [{ table: "lerg_6", column: "npa", op: EQ, value: "720" }]
                        limit: 10
                      }) {
                        count
                        data
                      }
                    }
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Query result data
                    additionalProperties: true
                  errors:
                    type: array
                    description: GraphQL errors (if any)
                    items:
                      type: object
                      properties:
                        message:
                          type: string
              example:
                data:
                  lerg6:
                    - npa: "720"
                      nxx: "708"
                      blockId: A
                      ocn: "7167"
                      locName: DENVER
                      locState: CO
                      switch: DNVRCO93DS0
                      carrier:
                        ocnNum: "7167"
                        ocnName: CELLCO PARTNERSHIP DBA VERIZON WIRELESS
  /v1/telique/cic/{crn}/{ani}/{lata}:
    get:
      operationId: lookupCic
      tags:
        - RouteLink
      summary: Look up the Carrier Identification Code for a toll-free call
      description: |
        Interprets the Call Processing Record (CPR) for the given toll-free
        number (CRN) using the caller's ANI and LATA to walk the decision
        tree, returning the routed carrier and optional Network Management
        Class (NMC).

        **Plain text response** (default):
        - When no NMC is present: the 4-digit zero-padded carrier code
          (e.g. `0288`).
        - When an NMC is present: a compact JSON blob with the unpadded
          integer carrier and NMC (e.g. `{"carrier":288,"networkmanagementclass":14}`).

        If the CRN is not found, the response is `0000` with HTTP 200 (for
        compatibility with legacy cicdip clients).
      parameters:
        - $ref: "#/components/parameters/crn"
        - $ref: "#/components/parameters/ani"
        - $ref: "#/components/parameters/lata"
        - $ref: "#/components/parameters/format"
      responses:
        "200":
          description: Successful CIC lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CicResponse"
              example:
                carrier: "0288"
                networkmanagementclass: 14
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              examples:
                withoutNmc:
                  summary: No NMC present
                  value: "0288"
                withNmc:
                  summary: NMC present (carrier emitted as unpadded integer)
                  value: '{"carrier":288,"networkmanagementclass":14}'
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/telique/cicror/{crn}/{ani}/{lata}:
    get:
      operationId: lookupCicRor
      tags:
        - RouteLink
      summary: Look up both the CIC and Responsible Organization for a toll-free call
      description: |
        Combines a CIC lookup (CPR interpretation) with the CRN's Responsible
        Organization. Useful when the caller needs both routing and ownership
        data in a single request.

        **Plain text response** (default): `{carrier};{ror}` (e.g. `0288;ATX01`).

        If the CRN is not found, the response is `0000;` with HTTP 200 (for
        compatibility with legacy cicdip clients).
      parameters:
        - $ref: "#/components/parameters/crn"
        - $ref: "#/components/parameters/ani"
        - $ref: "#/components/parameters/lata"
        - $ref: "#/components/parameters/format"
      responses:
        "200":
          description: Successful CIC + ROR lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CicRorResponse"
              example:
                carrier: "0288"
                ror: ATX01
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              example: 0288;ATX01
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/telique/ror/{crn}:
    get:
      operationId: lookupRor
      tags:
        - RouteLink
      summary: Look up the Responsible Organization for a toll-free number
      description: |
        Returns the ROR (Responsible Organization) code assigned to the given
        toll-free number. Does not require ANI or LATA since no CPR
        interpretation is performed.

        **Plain text response** (default): the ROR code (e.g. `ATX01`).

        If the CRN is not found, the response is an empty string with HTTP 200
        (for compatibility with legacy cicdip clients).
      parameters:
        - name: crn
          in: path
          required: true
          description: 10-digit toll-free number (digits only)
          schema:
            type: string
            pattern: ^\d{10}$
            example: "8005551234"
        - $ref: "#/components/parameters/format"
      responses:
        "200":
          description: Successful ROR lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RorResponse"
              example:
                ror: ATX01
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              example: ATX01
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/telique/ror/{ror}/tfns:
    get:
      operationId: lookupTfnsByRor
      tags:
        - RouteLink
      summary: List toll-free numbers assigned to a Responsible Organization
      description: |
        Returns a paginated list of toll-free numbers (CRNs) that belong to
        the given ROR. Results are paginated with `limit` and `offset` query
        parameters.

        **Plain text response** (default): header lines followed by one TFN
        per line.
      parameters:
        - $ref: "#/components/parameters/ror"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Successful TFN list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TfnsByRorResponse"
              example:
                ror: ATX01
                total_count: 1814973
                tfns:
                  - "8002257793"
                  - "8003216540"
                  - "8004417890"
                  - "8005029311"
                  - "8006183472"
                limit: 5
                offset: 0
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              example: |
                ROR: ATX01
                Total: 1814973
                Showing: 1-5

                8002257793
                8003216540
                8004417890
                8005029311
                8006183472
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/telique/ror/{ror}/cprs:
    get:
      operationId: lookupCprsByRor
      tags:
        - RouteLink
      summary: List Call Processing Records assigned to a Responsible Organization
      description: |
        Returns a paginated list of template CRN identifiers whose CPRs belong
        to the given ROR. Template CRNs start with leading zeros
        (e.g. `0000350718`). Paginated with `limit` and `offset`.

        **Plain text response** (default): header lines followed by one
        template CRN per line.
      parameters:
        - $ref: "#/components/parameters/ror"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Successful CPR list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CprsByRorResponse"
              example:
                ror: ATX01
                total_count: 248132
                cprs:
                  - "0000350718"
                  - "0000350719"
                  - "0000350720"
                limit: 3
                offset: 0
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              example: |
                ROR: ATX01
                Total: 248132
                Showing: 1-3

                0000350718
                0000350719
                0000350720
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/telique/cpr/{crn}:
    get:
      operationId: dumpCpr
      tags:
        - RouteLink
      summary: Dump the CPR decision tree for a toll-free number or template
      description: |
        Returns the full Call Processing Record for a CRN, including the
        decision tree rendered as human-readable text. Accepts 1–10 digit
        CRNs; shorter values are zero-padded to 10 digits (e.g. `350718` →
        `0000350718`), which is useful for looking up template CPRs directly.

        Set `?expand=true` to recursively resolve and inline any referenced
        template decision trees.

        **Plain text response** (default): metadata header followed by the
        rendered decision tree. If the CRN has no CPR, the response still
        returns HTTP 200 with `CPR: (none)` in the body.
      parameters:
        - name: crn
          in: path
          required: true
          description: 1–10 digit CRN or template ID (digits only). Values shorter than 10 digits are zero-padded.
          schema:
            type: string
            pattern: ^\d{1,10}$
            example: "8002211212"
        - $ref: "#/components/parameters/format"
        - name: expand
          in: query
          required: false
          description: When true, recursively resolves referenced template CPRs and inlines their decision trees.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful CPR dump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CprDumpResponse"
              example:
                crn: "8002211212"
                ror: ATX01
                cpr_sha1: f4fbadea1aed0c596ef3a764b364485ad945af92
                cpr_json:
                  node:
                    type: action
                    values:
                      - template: "0000350718"
                tree_text: |
                  -> Template 0000350718
                timestamp: 2026-04-04T14:32:15.123456Z
            text/plain:
              schema:
                type: string
              example: |
                CRN: 8002211212
                ROR: ATX01
                CPR SHA1: f4fbadea1aed0c596ef3a764b364485ad945af92
                Templates: [350718]
                ======= CPR Decision Tree =======
                -> Template 0000350718
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: x-api-token
      description: API token for authentication. Get yours at https://telique.ringer.tel. Anonymous access (no token) is
        rate-limited to 10 requests per minute.
  schemas:
    LrnLookupResponse:
      type: object
      required:
        - phone_number
        - lrn
        - status
        - timestamp
      properties:
        phone_number:
          type: string
          description: Normalized 10-digit phone number
          example: "3036298301"
        lrn:
          type: string
          description: Local Routing Number — the switch serving this number
          example: "7207081999"
        status:
          type: string
          description: Request status
          example: success
        timestamp:
          type: string
          format: date-time
          description: Response timestamp (ISO 8601)
          example: 2026-04-04T23:04:50.391142767Z
        metadata:
          $ref: "#/components/schemas/LrnMetadata"
    LrnMetadata:
      type: object
      description: |
        Routing metadata for the LRN response. For authoritative NPAC port-event
        history (activation timestamp, transaction history), use the LSMS GraphQL
        `subscriptionVersion` query — this REST endpoint only carries the routing
        identifiers needed to dial the number.
      properties:
        spid:
          type: string
          description: Service Provider ID (4 characters)
          example: 567G
        lnp_type:
          type: string
          description: Local Number Portability type
          enum:
            - lspp
            - lisp
            - pool
          example: lspp
    DnoLookupResponse:
      type: object
      required:
        - phone_number
        - is_dno
        - status
        - timestamp
      properties:
        phone_number:
          type: string
          description: Phone number that was checked
          example: "8008291040"
        is_dno:
          type: boolean
          description: Whether the number is on the Do Not Originate list
          example: true
        status:
          type: string
          example: success
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T23:05:01.706505032Z
        source:
          type: string
          description: Source of the DNO entry (only present when is_dno is true)
          example: ITG
        created_at:
          type: string
          format: date-time
          description: When the DNO entry was created (only present when is_dno is true)
          example: 2022-10-12T07:44:48Z
        matched_pattern:
          type: string
          description: The pattern that matched (3, 6, 7, or 10 digits; only present when is_dno is true)
          example: "8008291040"
    PhoneNumberListResponse:
      type: object
      required:
        - count
        - phone_numbers
        - query
      properties:
        count:
          type: integer
          description: Number of results
          example: 3
        phone_numbers:
          type: array
          items:
            type: string
          description: List of 10-digit phone numbers
          example:
            - "3036298301"
            - "3036298302"
            - "3036298303"
        query:
          $ref: "#/components/schemas/LsmsListQuery"
    SpidListResponse:
      type: object
      required:
        - count
        - spids
        - query
      properties:
        count:
          type: integer
          description: Number of results
          example: 1
        spids:
          type: array
          items:
            type: string
          description: List of 4-character Service Provider IDs
          example:
            - 567G
        query:
          $ref: "#/components/schemas/LsmsListQuery"
    LrnListResponse:
      type: object
      required:
        - count
        - lrns
        - query
      properties:
        count:
          type: integer
          description: Number of results
          example: 2
        lrns:
          type: array
          items:
            type: string
          description: List of 10-digit Local Routing Numbers
          example:
            - "7207081999"
            - "3036298300"
        query:
          $ref: "#/components/schemas/LsmsListQuery"
    LsmsListQuery:
      type: object
      description: The query parameters that were used (echoed back)
      properties:
        lrn:
          type: string
          example: "7207081999"
        spid:
          type: string
          example: 567G
        phone_number:
          type: string
          example: "3036298301"
    ErrorResponse:
      type: object
      description: JSON error envelope returned for all 4xx/5xx responses, including on endpoints whose successful responses
        default to plain text. Fields mirror the service's error struct.
      required:
        - error
        - message
        - code
        - timestamp
      properties:
        error:
          type: string
          description: Machine-readable error code.
          example: INVALID_PHONE_NUMBER
        message:
          type: string
          description: Human-readable detail.
          example: "Invalid phone number format: Expected 10-digit US number or E.164 format."
        code:
          type: integer
          description: HTTP status code, repeated in the body.
          example: 400
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 timestamp of when the error was generated.
          example: 2026-04-04T23:04:50.391142767Z
        details:
          type: object
          description: Optional structured context; omitted when absent.
          additionalProperties: true
    CnamObject:
      type: object
      description: Caller name data
      properties:
        calling_name_status:
          type: string
          description: Whether a caller name is available for this number
          enum:
            - available
            - unavailable
          example: available
        calling_name:
          type: string
          description: The registered caller name (up to 15 characters). Present only when `calling_name_status` is `available`.
          example: WIRELESS CALLER
        presentation_indicator:
          type: string
          description: Whether the caller name is allowed to be displayed
          enum:
            - allowed
            - restricted
          example: allowed
    CallInsight:
      type: object
      description: Robocall Mitigation risk scoring (included when the subscription supports it)
      properties:
        call_treatment:
          type: string
          description: Recommended call treatment action
          enum:
            - ALLOW
            - DENY
            - REVIEW
          example: DENY
        fraud_score:
          type: integer
          description: Risk score from 0 (safe) to 100 (fraudulent)
          minimum: 0
          maximum: 100
          example: 100
        original_calling_name:
          type: string
          description: Original caller name before any modification
          example: Marketing Firm
        propensity:
          type: string
          description: Likelihood the call is unwanted
          enum:
            - very-low
            - low
            - medium
            - high
            - very-high
          example: very-high
        category_id:
          type: string
          description: Call category identifier. Included only when the upstream returns it.
        cv_data:
          type: object
          description: STIR/SHAKEN call-validation data (echoed when submitted in the request)
          properties:
            verstat:
              type: string
              example: TN-Validation-Failed
            attest:
              type: string
              example: C
            ppt:
              type: string
              example: shaken
            origid:
              type: string
              example: 1db966a6-8f30-11e7-bc77-fa163e70349d
    CnamResponse:
      type: object
      description: Response from the simplified CNAM lookup
      required:
        - status
      properties:
        status:
          type: string
          description: Response status
          example: ok
        cnam:
          $ref: "#/components/schemas/CnamObject"
    IdentityResponse:
      type: object
      description: Response from the full identity lookup
      required:
        - status
      properties:
        status:
          type: string
          description: Response status
          example: ok
        cnam:
          $ref: "#/components/schemas/CnamObject"
        call_insight:
          $ref: "#/components/schemas/CallInsight"
        addtl_info:
          type: object
          description: Additional metadata about the lookup. Included only when the upstream returns it.
          properties:
            cnam_type:
              type: string
              description: Source type of CNAM data
            cnam_source:
              type: string
              description: Provider source of CNAM data
    IdentityRequest:
      type: object
      description: Request body for the POST identity lookup
      required:
        - called_party
      properties:
        calling_party:
          type: string
          description: "Originating phone number — the number whose caller name is looked up. Optional: omitting it yields a
            less-useful result."
          pattern: ^(\+?1)?\d{10}$
          example: "5714345400"
        called_party:
          type: string
          description: Destination NANP phone number. Accepts 10 digits, 11 digits with a leading 1, or E.164 with a leading `+1`.
          pattern: ^(\+?1)?\d{10}$
          example: "3034298788"
        call_direction:
          type: string
          description: Direction of the call
          enum:
            - incoming
            - outgoing
          example: incoming
        txn_id:
          type: string
          description: Your transaction ID, echoed back in the response
          example: txn-20260404-002
        client_id:
          type: string
          description: Your client identifier (up to 32 alphanumeric characters)
          maxLength: 32
          example: telique-prod
        verstat:
          type: string
          description: STIR/SHAKEN verification status
          example: TN-Validation-Failed
        attest:
          type: string
          description: STIR/SHAKEN attestation level
          enum:
            - A
            - B
            - C
          example: C
        cv_data:
          type: object
          description: STIR/SHAKEN call-validation data (preserved as-is and forwarded to TransUnion)
          properties:
            verstat:
              type: string
              example: TN-Validation-Failed
            attest:
              type: string
              example: C
            ppt:
              type: string
              example: shaken
            origid:
              type: string
              example: 1db966a6-8f30-11e7-bc77-fa163e70349d
    CnamErrorResponse:
      type: object
      description: Error response
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type
          example: bad request
        message:
          type: string
          description: Human-readable error message
          example: called_party is required
    TableInfo:
      type: object
      required:
        - name
        - display_name
        - record_count
        - fields
      properties:
        name:
          type: string
          description: Internal table name
          example: lerg_6
        display_name:
          type: string
          description: Display name
          example: LERG 6
        record_count:
          type: integer
          description: Number of records in the table
          example: 1501514
        fields:
          type: array
          description: List of fields in the table
          items:
            $ref: "#/components/schemas/FieldInfo"
    TableSchemaResponse:
      type: object
      required:
        - table
        - display_name
        - fields
      properties:
        table:
          type: string
          description: Internal table name
          example: lerg_6
        display_name:
          type: string
          description: Display name
          example: LERG 6
        fields:
          type: array
          description: List of field definitions
          items:
            $ref: "#/components/schemas/FieldInfo"
    FieldInfo:
      type: object
      required:
        - name
        - display_name
        - data_type
        - nullable
      properties:
        name:
          type: string
          description: Internal field name
          example: npa
        display_name:
          type: string
          description: Display field name
          example: NPA
        data_type:
          type: string
          description: Data type of the field
          enum:
            - string
            - integer
            - float
            - boolean
            - date
          example: integer
        nullable:
          type: boolean
          description: Whether the field can be null
          example: false
    QueryResponse:
      type: object
      required:
        - table
        - count
        - data
      properties:
        table:
          type: string
          description: Name of the queried table
          example: lerg_6
        count:
          type: integer
          description: Number of records returned
          example: 3
        total_unique:
          type: integer
          description: Total unique records matching the query before pagination. Emitted by the fast LERG 6 endpoint and the
            generic GET query endpoint.
        offset:
          type: integer
          description: Pagination offset used for this response. Emitted by the fast LERG 6 endpoint only.
        limit:
          type: integer
          description: Pagination limit used for this response. Emitted by the fast LERG 6 endpoint only.
        data:
          type: array
          description: Query results — fields vary by request
          items:
            type: object
            additionalProperties: true
        joined_with:
          type: string
          nullable: true
          description: Name of the joined table when a join was applied. Always present on responses from `POST
            /v1/telique/lerg/query`; `null` when no join was requested.
    ComplexQueryRequest:
      type: object
      required:
        - table
      properties:
        table:
          type: string
          description: Name of the table to query
          example: lerg_6
        fields:
          type: array
          description: Fields to return (all fields if omitted)
          items:
            type: string
          example:
            - npa
            - nxx
            - ocn
            - loc_name
        filters:
          type: array
          description: Filter conditions (combined with AND)
          items:
            $ref: "#/components/schemas/FilterCondition"
        limit:
          type: integer
          description: Maximum number of records to return
          minimum: 1
          maximum: 10000
          default: 100
          example: 10
        offset:
          type: integer
          description: Number of records to skip
          minimum: 0
          default: 0
          example: 0
        join:
          $ref: "#/components/schemas/JoinClause"
    FilterCondition:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: Field name to filter on
          example: npa
        operator:
          type: string
          description: Filter operator
          enum:
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - like
            - in
            - notin
            - isnull
            - isnotnull
          example: eq
        value:
          description: Value to filter by (type depends on field and operator)
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
    JoinClause:
      type: object
      required:
        - table
        - on
      properties:
        table:
          type: string
          description: Table to join with
          example: lerg_1
        on:
          type: array
          description: Join conditions
          items:
            $ref: "#/components/schemas/JoinCondition"
        fields:
          type: array
          description: Fields to include from joined table
          items:
            type: string
          example:
            - ocn_name
        join_type:
          type: string
          description: Type of join (defaults to inner)
          enum:
            - inner
            - left
            - right
          default: inner
          example: inner
    JoinCondition:
      type: object
      required:
        - left_field
        - right_field
      properties:
        left_field:
          type: string
          description: Field from the main table
          example: ocn
        right_field:
          type: string
          description: Field from the joined table
          example: ocn_num
    TandemQueryResponse:
      type: object
      required:
        - count
        - records
        - query
      properties:
        count:
          type: integer
          description: Number of records returned
          example: 1
        records:
          type: array
          description: Tandem query results
          items:
            $ref: "#/components/schemas/TandemRecord"
        query:
          type: object
          description: Query metadata
          required:
            - query_type
            - limit
            - offset
          properties:
            query_type:
              type: string
              description: Type of query performed
              enum:
                - npa_nxx
                - switch
                - tandem
                - name
              example: npa_nxx
            limit:
              type: integer
              description: Maximum records requested
              example: 100
            offset:
              type: integer
              description: Number of records skipped
              example: 0
    TandemRecord:
      type: object
      properties:
        npa:
          type: string
          description: NPA (area code) — only present for tandem/name queries
          nullable: true
          example: "303"
        nxx:
          type: string
          description: NXX (exchange) — only present for tandem/name queries
          nullable: true
          example: "629"
        ocn_name:
          type: string
          description: Operating Company Name
          nullable: true
          example: QWEST CORPORATION
        ocn:
          type: string
          description: Operating Company Number
          nullable: true
          example: "9636"
        lata:
          type: string
          description: LATA code
          nullable: true
          example: "656"
        lata_name:
          type: string
          description: LATA name
          nullable: true
          example: DENVER CO
        state:
          type: string
          description: State code
          nullable: true
          example: CO
        switch:
          type: string
          description: Switch CLLI code
          nullable: true
          example: DNVRCOMADS0
        tandem:
          type: string
          description: Tandem switch CLLI code
          nullable: true
          example: DNVRCOMA02T
        tandem_ocn:
          type: string
          description: Tandem Operating Company Number
          nullable: true
          example: "9636"
        tandem_ocn_name:
          type: string
          description: Tandem Operating Company Name
          nullable: true
          example: QWEST CORPORATION
    LergErrorResponse:
      type: object
      required:
        - error
        - status
      properties:
        error:
          type: string
          description: Error message
          example: Invalid request
        status:
          type: integer
          description: HTTP status code
          example: 400
    RoutelinkErrorResponse:
      type: object
      properties:
        error:
          type: boolean
          example: true
        error_code:
          type: integer
          description: HTTP status code
          example: 400
        error_type:
          type: string
          description: Machine-readable error category
          enum:
            - parse
            - unknowncrn
            - templatemissing
            - interp
            - ratelimit
            - unavailable
            - other
          example: parse
        error_desc:
          type: string
          description: Human-readable error message
          example: "Invalid CRN format: abc"
    CicResponse:
      type: object
      properties:
        carrier:
          type: string
          description: 4-digit Carrier Identification Code (zero-padded)
          example: "0288"
        networkmanagementclass:
          type: integer
          description: Network Management Class (present only when the CPR specifies one)
          example: 14
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - carrier
        - timestamp
    CicRorResponse:
      type: object
      properties:
        carrier:
          type: string
          description: 4-digit Carrier Identification Code (zero-padded)
          example: "0288"
        ror:
          type: string
          description: Responsible Organization code
          example: ATX01
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - carrier
        - ror
        - timestamp
    RorResponse:
      type: object
      properties:
        ror:
          type: string
          description: Responsible Organization code
          example: ATX01
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - ror
        - timestamp
    TfnsByRorResponse:
      type: object
      properties:
        ror:
          type: string
          description: Responsible Organization code
          example: ATX01
        total_count:
          type: integer
          description: Total number of TFNs assigned to this ROR
          example: 1814973
        tfns:
          type: array
          items:
            type: string
          description: List of 10-digit toll-free numbers
        limit:
          type: integer
          description: Requested page size
          example: 1000
        offset:
          type: integer
          description: Number of results skipped
          example: 0
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - ror
        - total_count
        - tfns
        - limit
        - offset
        - timestamp
    CprsByRorResponse:
      type: object
      properties:
        ror:
          type: string
          description: Responsible Organization code
          example: ATX01
        total_count:
          type: integer
          description: Total number of CPR templates for this ROR
          example: 248132
        cprs:
          type: array
          items:
            type: string
          description: List of 10-digit template CRN identifiers
        limit:
          type: integer
          description: Requested page size
          example: 1000
        offset:
          type: integer
          description: Number of results skipped
          example: 0
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - ror
        - total_count
        - cprs
        - limit
        - offset
        - timestamp
    CprDumpResponse:
      type: object
      properties:
        crn:
          type: string
          description: 10-digit CRN (zero-padded)
          example: "8002211212"
        ror:
          type: string
          nullable: true
          description: Responsible Organization code, or null if the CRN has no ROR assigned
          example: ATX01
        cpr_sha1:
          type: string
          nullable: true
          description: SHA-1 hash of the CPR content, or null if the CRN has no CPR
          example: f4fbadea1aed0c596ef3a764b364485ad945af92
        cpr_json:
          type: object
          nullable: true
          description: Raw CPR decision tree as JSON. Omitted from the response when the CRN has no CPR.
        tree_text:
          type: string
          description: Human-readable rendering of the CPR decision tree (empty string if the CRN has no CPR)
          example: |
            -> Template 0000350718
        timestamp:
          type: string
          format: date-time
          example: 2026-04-04T14:32:15.123456Z
      required:
        - crn
        - ror
        - cpr_sha1
        - tree_text
        - timestamp
  parameters:
    crn:
      name: crn
      in: path
      required: true
      description: 10-digit toll-free number (digits only)
      schema:
        type: string
        pattern: ^\d{10}$
        example: "8005551234"
    ani:
      name: ani
      in: path
      required: true
      description: 10-digit caller number / Automatic Number Identification (digits only)
      schema:
        type: string
        pattern: ^\d{10}$
        example: "2125551234"
    lata:
      name: lata
      in: path
      required: true
      description: 3-digit Local Access Transport Area code
      schema:
        type: string
        pattern: ^\d{3}$
        example: "820"
    ror:
      name: ror
      in: path
      required: true
      description: 1–5 character Responsible Organization code (alphanumeric, case-insensitive)
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{1,5}$
        example: ATX01
    format:
      name: format
      in: query
      required: false
      description: Response format. Defaults to plain text.
      schema:
        type: string
        enum:
          - plain
          - json
          - xml
        default: plain
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return (default 1000, max 10000)
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
    offset:
      name: offset
      in: query
      required: false
      description: Number of results to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Invalid request parameters (malformed CRN, ANI, LATA, or ROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: true
            error_code: 400
            error_type: parse
            error_desc: "Invalid CRN format: abc"
    InternalError:
      description: CPR interpretation failed (malformed routing tree, missing template, or unexpected interpreter error)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: true
            error_code: 500
            error_type: interp
            error_desc: CPR interpretation failed
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: true
            error_code: 429
            error_type: ratelimit
            error_desc: Rate limit exceeded
    ServiceUnavailable:
      description: Data store service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: true
            error_code: 503
            error_type: unavailable
            error_desc: Data store unavailable
