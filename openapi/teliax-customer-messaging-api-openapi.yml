openapi: 3.2.0
info:
  title: Teliax Customer/Messaging API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Customer/Messaging across 2 of this provider''s published API definitions: teliax-warp-openapi.json, teliax-warp-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //api.warp.ringer.tel
tags:
- name: Customer/Messaging
paths:
  /v1/messages:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists the active customer''s messages (inbound and outbound), most

        recent first. Filter by direction and status.


        Errors: NO_ACTIVE_CUSTOMER, UNAUTHORIZED (401); INTERNAL_ERROR (500).'
      tags:
      - Customer/Messaging
      summary: List messages
      parameters:
      - description: Page (1-based)
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - description: Page size (max 100)
        name: per_page
        in: query
        schema:
          type: integer
          default: 20
      - description: Filter by direction
        name: direction
        in: query
        schema:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
      - description: Filter by delivery status (e.g. queued, sent, delivered, failed)
        name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.ListResponse'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.Message'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1Messages
      x-operation-id-source: derived
    post:
      security:
      - ApiKeyAuth: []
      description: 'Sends an outbound SMS from one of your assigned numbers. The

        `from` number must be assigned to your account and enrolled in an

        approved 10DLC campaign, otherwise the request is rejected.


        Supply an `Idempotency-Key` header to make retries safe: a repeated

        request with the same key returns the original message with HTTP 200

        instead of creating a duplicate (a first successful create returns 201).


        Errors: NO_ACTIVE_CUSTOMER, UNAUTHORIZED (401); INVALID_PAYLOAD,

        MISSING_PARAM, INVALID_TO (400); FROM_NOT_OWNED (403, the `from`

        number is not assigned to your account); CAMPAIGN_NOT_APPROVED (403,

        the `from` number is not enrolled in an approved 10DLC campaign);

        INTERNAL_ERROR (500).'
      tags:
      - Customer/Messaging
      summary: Send an SMS message
      parameters:
      - description: Client-supplied key that makes retries idempotent
        name: Idempotency-Key
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.createMessageRequest'
        description: Message to send
        required: true
      responses:
        '200':
          description: Idempotent replay — the message for this Idempotency-Key already exists
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.Message'
        '201':
          description: Message created and handed off to the messaging gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.Message'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '403':
          description: FROM_NOT_OWNED or CAMPAIGN_NOT_APPROVED
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1Messages
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messages/stats:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Returns aggregate message counts for the active customer: overall

        totals (total, inbound, outbound, delivered, failed) plus a

        per-campaign breakdown.


        Errors: NO_ACTIVE_CUSTOMER, UNAUTHORIZED (401); INTERNAL_ERROR (500).'
      tags:
      - Customer/Messaging
      summary: Get message statistics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.MessageStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagesStats
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messages/{id}:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Retrieves a single message owned by the active customer by its

        WARP message UUID.


        Errors: NO_ACTIVE_CUSTOMER, UNAUTHORIZED (401); INVALID_ID (400);

        NOT_FOUND (404); INTERNAL_ERROR (500).'
      tags:
      - Customer/Messaging
      summary: Get a message
      parameters:
      - description: Message UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.Message'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagesById
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messaging/brands:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists the active customer''s registered 10DLC brands. Each item in

        `data.items` is a snake_case TCR brand object proxied from the

        messaging backend (fields are normalized from the upstream

        camelCase); shape follows the TCR brand model.'
      tags:
      - Customer/Messaging
      summary: List 10DLC brands
      parameters:
      - description: Page (1-based)
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - description: Page size (max 100)
        name: per_page
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: data.items is an array of snake_case TCR brand objects
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.ListResponse'
        '502':
          description: TNIQ_ERROR — messaging backend unavailable
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagingBrands
      x-operation-id-source: derived
    post:
      security:
      - ApiKeyAuth: []
      description: 'Registers a new 10DLC brand for the active customer, stamping the

        applicationId ownership binding. `data` is the created snake_case TCR

        brand object.


        Errors: INVALID_PAYLOAD, TNIQ_VALIDATION (400); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Create 10DLC brand
      requestBody:
        $ref: '#/components/requestBodies/github_com_ringer-warp_api-gateway_internal_tniq.BrandPayload'
      responses:
        '201':
          description: data is the created snake_case TCR brand object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1MessagingBrands
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messaging/brands/link:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Links a brand that already exists at TCR into the active customer''s

        account. `data` is the linked snake_case TCR brand object.


        Errors: INVALID_PAYLOAD (400); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Link an existing TCR brand into this account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.linkBrandRequest'
        description: TCR brand ID
        required: true
      responses:
        '200':
          description: data is the linked snake_case TCR brand object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1MessagingBrandsLink
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messaging/brands/lookup/{tcrBrandId}:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Reads brand details from TCR by TCR brand ID, without requiring the

        brand to be registered in this account. `data` is a snake_case TCR

        brand object.


        Errors: NOT_FOUND (404); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Look up a TCR brand directly
      parameters:
      - description: TCR brand ID
        name: tcrBrandId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: data is a snake_case TCR brand object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagingBrandsLookupByTcrBrandId
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messaging/brands/{id}:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Retrieves a single 10DLC brand owned by the active customer. `data`

        is a snake_case TCR brand object proxied from the messaging backend.


        Errors: NOT_FOUND (404, includes cross-tenant access); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Get brand by ID
      parameters:
      - description: Brand ID (messaging-backend UUID)
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: data is a snake_case TCR brand object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagingBrandsById
      x-operation-id-source: derived
    put:
      security:
      - ApiKeyAuth: []
      description: 'Full replace of a 10DLC brand owned by the active customer (PUT

        semantics). `data` is the updated snake_case TCR brand object.


        Errors: INVALID_PAYLOAD (400); NOT_FOUND (404); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Update 10DLC brand
      parameters:
      - description: Brand ID
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/github_com_ringer-warp_api-gateway_internal_tniq.BrandPayload'
      responses:
        '200':
          description: data is the updated snake_case TCR brand object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: putV1MessagingBrandsById
      x-operation-id-source: derived
    delete:
      security:
      - ApiKeyAuth: []
      description: 'Deletes a 10DLC brand owned by the active customer.


        Errors: NOT_FOUND (404); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Delete 10DLC brand
      parameters:
      - description: Brand ID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Brand deleted
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: deleteV1MessagingBrandsById
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/messaging/campaigns:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists the active customer''s 10DLC campaigns, optionally filtered by

        parent brand. Each item in `data.items` is a snake_case TCR campaign

        object proxied from the messaging backend.'
      tags:
      - Customer/Messaging
      summary: List 10DLC campaigns
      parameters:
      - description: Page (1-based)
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - description: Page size (max 100)
        name: per_page
        in: query
        schema:
          type: integer
          default: 20
      - description: Filter by parent brand ID
        name: brand_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: data.items is an array of snake_case TCR campaign objects
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.ListResponse'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1MessagingCampaigns
      x-operation-id-source: derived
    post:
      security:
      - ApiKeyAuth: []
      description: 'Registers a new 10DLC campaign for the active customer, stamping the

        applicationId ownership binding. `data` is the created snake_case TCR

        campaign object.


        Errors: INVALID_PAYLOAD, TNIQ_VALIDATION (400); TNIQ_ERROR (502).'
      tags:
      - Customer/Messaging
      summary: Create 10DLC campaign
      requestBody:
        $ref: '#/components/requestBodies/github_com_ringer-warp_api-gateway_internal_tniq.CampaignPayload'
      responses:
        '201':
          description: data is the created snake_case TCR campaign object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1MessagingCampaigns
