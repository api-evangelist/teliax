  /v1/numbers/bulk-assign:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Procures and assigns up to 200 numbers in one idempotent batch. Requires a UUID Idempotency-Key header (reused as procurement_request_id). Per-TN failures do not abort the batch. Provider sourcing (TNIQ vs Inteliquent) is automatic per TN, following how each number was found in search; a mixed cart is fine. Optional extras — cnam_enabled (inbound caller-name dip; requires a trunk), cnam_display_name (outbound CNAM listing, ≤15 chars, DIDs only), campaign_id (attach to a 10DLC campaign) — apply per successfully assigned TN, best-effort: outcomes land in each result''s extras map (keys cnam_dip/cnam_listing/campaign) and never fail the batch. Optional batch voice routing: routing_type trunk|forward|reject (+forward_to_number, forward_preserve_ani); voicemail not yet available. Errors: INVALID_REQUEST, MISSING_IDEMPOTENCY_KEY, INVALID_IDEMPOTENCY_KEY, TRUNK_UNOWNED (whole-request 403 on default_trunk_id).'
      tags:
