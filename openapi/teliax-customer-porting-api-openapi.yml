openapi: 3.2.0
info:
  title: Teliax Customer/Porting API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Customer/Porting across 2 of this provider''s published API definitions: teliax-warp-openapi.json, teliax-warp-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //api.warp.ringer.tel
tags:
- name: Customer/Porting
paths:
  /v1/porting/preview:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Runs an instant Telique-backed portability preview for a free-form list of TNs and groups them by current SPID. tns accepts a comma/space/newline-separated string or an array of TN strings. No project is created. Errors: NO_ACTIVE_CUSTOMER, INVALID_PAYLOAD, VALIDATION_ERROR, GATEWAY_UNAVAILABLE.'
      tags:
      - Customer/Porting
      summary: Preview a port-in
      requestBody:
        $ref: '#/components/requestBodies/internal_handlers.PortingTNsRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingPreviewResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingPreview
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Returns the active customer''s port-in requests, most-recent first. Each row includes can_resume, a server-derived capability for unsubmitted drafts. Errors: NO_ACTIVE_CUSTOMER, INTERNAL_ERROR.'
      tags:
      - Customer/Porting
      summary: List port-in requests
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_repository.PortRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1PortingRequests
      x-operation-id-source: derived
    post:
      security:
      - ApiKeyAuth: []
      description: 'Creates a draft port-in request (TNIQ project + WARP mirror row). `desired_due_date` is required and must clear the losing carrier''s minimum notice window; a date that is too soon returns PORT_WINDOW_VIOLATION with `error.details.earliest_date`. Errors: NO_ACTIVE_CUSTOMER, INVALID_PAYLOAD, PORT_WINDOW_VIOLATION, TNIQ_ERROR, INTERNAL_ERROR, GATEWAY_UNAVAILABLE.'
      tags:
      - Customer/Porting
      summary: Create a port-in draft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.PortingCreateDraftRequest'
        description: Draft name + desired due date
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingCreateDraftResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingRequests
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Returns the mirror row, live TNIQ project, off-net carrier groups, and a server-derived resume descriptor selecting the earliest incomplete wizard step. Reconciles any ACTIVATED TNs into inventory (idempotent). Errors: NO_ACTIVE_CUSTOMER, INVALID_ID, NOT_FOUND, CONFLICT.'
      tags:
      - Customer/Porting
      summary: Get a port-in request
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingDetailResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1PortingRequestsById
      x-operation-id-source: derived
    delete:
      security:
      - ApiKeyAuth: []
      description: 'Deletes a pre-submission draft (TNIQ project + WARP mirror row). Gated to states with zero submitted TNs. Requires step-up MFA. Errors: NOT_FOUND, CONFLICT, TNIQ_ERROR, INTERNAL_ERROR.'
      tags:
      - Customer/Porting
      summary: Delete a port-in draft
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingDeletedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: deleteV1PortingRequestsById
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/actions/{actionId}/respond:
    post:
      security:
      - ApiKeyAuth: []
      description: Completes one current customer action using only its published allowed response. Requires step-up MFA.
      tags:
      - Customer/Porting
      summary: Complete a managed port action
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Managed action UUID
        name: actionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_porting.ActionResponse'
        description: Allowed action response
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.ManagedPortResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingRequestsByIdActionsByActionIdRespond
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/activate:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Activates numbers that have reached FOC. Gated on the project being activatable. Requires step-up MFA. Errors: NOT_FOUND, CONFLICT, TNIQ_ERROR.'
      tags:
      - Customer/Porting
      summary: Activate ported numbers
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/internal_handlers.PortingTNSelectionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_tniq.BulkActionResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingRequestsByIdActivate
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/auto-activation:
    put:
      security:
      - ApiKeyAuth: []
      description: 'Updates the project''s auto-activation mode (DISABLED | ASAP | SCHEDULED; scheduled_at required for SCHEDULED). Errors: INVALID_PAYLOAD, NOT_FOUND, TNIQ_ERROR.'
      tags:
      - Customer/Porting
      summary: Set auto-activation policy
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.PortingAutoActivationRequest'
        description: Auto-activation policy
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingMessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: putV1PortingRequestsByIdAutoActivation
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/auto-fix:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Applies TNIQ auto-fixes to the project, optionally scoped to an error group or TN subset. Errors: NOT_FOUND, TNIQ_ERROR.'
      tags:
      - Customer/Porting
      summary: Auto-fix port-in errors
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.PortingAutoFixRequest'
        description: Optional error-group / TN scope
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/internal_handlers.PortingMessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingRequestsByIdAutoFix
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/cancel:
    post:
      security:
      - ApiKeyAuth: []
      description: 'Cancels the port. An omitted body, `{}`, or an empty `tns` array explicitly selects whole-project cancellation; a non-empty `tns` array cancels only that eligible subset. Gated on the project being cancellable. Requires step-up MFA. Errors: INVALID_PAYLOAD, NOT_FOUND, CONFLICT, TNIQ_ERROR.'
      tags:
      - Customer/Porting
      summary: Cancel a port-in request
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.PortingTNSelectionRequest'
        description: Optional TN subset; omitted or empty means cancel the whole project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_tniq.BulkActionResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: postV1PortingRequestsByIdCancel
      x-operation-id-source: derived
    servers:
    - url: //api.warp.ringer.tel
  /v1/porting/requests/{id}/documents:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists the project''s documents, optionally filtered by doc_type or tn. signer_ip is present only for operator callers. Errors: NOT_FOUND, TNIQ_ERROR.'
      tags:
      - Customer/Porting
      summary: List port documents
      parameters:
      - description: Port request UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Filter by document type
        name: doc_type
        in: query
        schema:
          type: string
      - description: Filter by TN
        name: tn
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/internal_handlers.PortingDocument'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
