      - Customer/Team
      summary: Set a member's role
      parameters:
      - description: Customer UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: User UUID
        name: userId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_handlers.setMemberRoleRequest'
        description: Role to assign
        required: true
      responses:
