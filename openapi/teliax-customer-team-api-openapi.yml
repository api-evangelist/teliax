                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
      operationId: getV1CustomersByIdHubspotContacts
      x-operation-id-source: derived
  /v1/customers/{id}/invitations:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Lists every unaccepted, unexpired invitation for this customer so the team page can show who has been invited. Requires the team:read scope; non-superAdmin callers may only target their own active customer. Errors: INVALID_CUSTOMER_ID, NO_ACTIVE_CUSTOMER, NOT_A_MEMBER, INTERNAL_ERROR.'
