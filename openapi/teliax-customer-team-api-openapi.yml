openapi: 3.2.0
info:
  description: Wholesale telecom platform API — SIP trunking, numbers, porting, messaging, and billing. All customer endpoints accept an API key (Bearer rk_...) or a session cookie; responses use the {success, data} / {success:false, error:{code,message}} envelope.
  title: WARP Customer Customer/Team API
  contact: {}
  version: 1.0.0
servers:
- url: //api.warp.ringer.tel
tags:
- name: Customer/Team
paths:
  /v1/customers/{id}/hubspot-contacts:
    get:
      security:
      - ApiKeyAuth: []
      description: 'Contacts of the customer''s linked HubSpot company, for prefilling team invitations. Returns an empty list when the customer has no HubSpot link or HubSpot integration is not configured — the invite form degrades to free entry. Requires the team:read scope; non-superAdmin callers may only target their own active customer. Errors: INVALID_CUSTOMER_ID, NO_ACTIVE_CUSTOMER, NOT_A_MEMBER, NOT_FOUND.'
      tags:
      - Customer/Team
      summary: List HubSpot contacts for invite autocomplete
      parameters:
      - description: Customer UUID
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/internal_handlers.HubSpotInviteContact'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIResponse'
                - type: object
                  properties:
                    error:
                      $ref: '#/components/schemas/github_com_ringer-warp_api-gateway_internal_models.APIError'
        '404':
          description: Not Found
