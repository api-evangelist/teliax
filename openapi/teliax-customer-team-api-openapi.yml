  /v1/customers/{id}/invitations/{invitationId}:
    delete:
      security:
      - ApiKeyAuth: []
      description: 'Revokes a pending invitation issued for this customer so its token can no longer be accepted. Requires the team:write scope; non-superAdmin callers may only target their own active customer, and the invitation must belong to it. Errors: INVALID_CUSTOMER_ID, INVALID_ID, NO_ACTIVE_CUSTOMER, NOT_A_MEMBER, NOT_FOUND.'
