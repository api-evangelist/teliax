        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Invitation UUID
        name: invitationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
