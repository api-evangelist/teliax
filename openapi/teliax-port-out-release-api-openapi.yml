    CarrierReleaseRecoveryProjection:
      type: object
      properties:
        state:
          type: string
          enum:
          - NONE
          - QUEUED
          - SUBMITTING
          - AWAITING_CARRIER
          - AWAITING_NPAC_RELEASE
          - READY_TO_RESUBMIT
          - FAILED
          - OUTCOME_UNKNOWN
          - VERIFICATION_REQUIRED
        requested_due_date:
