        npacRegion:
          type: string
        currentOcn:
          type: string
        currentLrn:
          type: string
        currentSpid:
          type: string
        currentSpidName:
          type: string
        currentTandem:
          type: string
        currentTandemName:
          type: string
        gainingOcn:
          type: string
        gainingLrn:
          type: string
        gainingSpid:
