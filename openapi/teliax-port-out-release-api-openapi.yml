    SubscriberData:
      type: object
      properties:
        accountNumber:
          type: string
        endUserName:
          type: string
        streetNum:
          type: string
        streetName:
          type: string
        streetType:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        pin:
          type: string
