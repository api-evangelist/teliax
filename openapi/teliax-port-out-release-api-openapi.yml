          - LSR_PENDING
          - LSR_SUBMITTED
          - CSR_PENDING
          - CSR_APPROVED
          - CSR_MISMATCH
          - SUPPLEMENT_REQUESTED
          - PENDING_FOC
          - FOC_RECEIVED
          - PORT_CONFLICT
          - PORT_EXCEPTION
          - AWAITING_DUE_DATE
          - READY_FOR_ACTIVATION
          - ACTIVATING
          - ACTIVATED
          - INTRASP_PENDING
          - INTRASP_TIMEOUT
          - INTRASP_COMPLETED
          - PORT_OUT_REQUESTED
          - PORT_OUT_CSR_ISSUED
          - PORT_OUT_PENDING
          - PORTED_OUT
          - CANCELLED
          - FAILED
          - LRN_CREATED
          - DISCONNECTED
        npac:
