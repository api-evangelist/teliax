          format: date
        can_request:
          type: boolean
        can_resubmit:
          type: boolean
        blocker_code:
          type: string
        message:
          type: string
    NpacStateResponse:
      type: object
      properties:
        status:
          type: string
        role:
          type: string
        our_spid:
          type: string
        new_spid:
          type: string
        old_spid:
          type: string
        lrn:
          type: string
        new_sp_due_date:
          type: string
          format: date
        old_sp_due_date:
          type: string
          format: date
        old_sp_authorization:
          type: string
        conflict_placed_by:
          type: string
        conflict_at:
          type: string
          format: date-time
        raw_sv_state:
          type: string
        observed_at:
          type: string
          format: date-time
        source:
          type: string
        current_spid:
          type: string
    ApplicationAssignmentIntentResponse:
      type: object
      properties:
        applicationId:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: object
        orderReference:
          type: string
        frozen:
          type: boolean
    MetadataDisplayColumn:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
    TnLookupResponse:
      type: object
      properties:
        results:
          type: array
          description: Individual TN lookup results
          items:
            $ref: '#/components/schemas/TnLookupResult'
        spidGroups:
          type: object
          additionalProperties:
            type: array
            description: TNs grouped by source SPID for project creation
            items:
              type: string
              description: TNs grouped by source SPID for project creation
          description: TNs grouped by source SPID for project creation
        notFound:
          type: array
          description: TNs not found in inventory or Telique
          items:
            type: string
            description: TNs not found in inventory or Telique
        summary:
          $ref: '#/components/schemas/LookupSummary'
      description: TN lookup results with SPID grouping
    PortProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        customer_id:
          type: string
          format: uuid
        customer_name:
          type: string
        spid:
          type: string
        status:
          type: string
        total_tns:
          type: integer
          format: int32
        valid_tns:
          type: integer
          format: int32
        error_tns:
          type: integer
          format: int32
        attention_tns:
          type: integer
          format: int32
        attention_breakdown:
          type: object
          additionalProperties:
            type: integer
            format: int32
        validated_tns:
          type: integer
          format: int32
        submitted_tns:
          type: integer
          format: int32
        activated_tns:
          type: integer
          format: int32
        cancelled_tns:
          type: integer
          format: int32
        completed_tns:
          type: integer
          format: int32
        progressPercentage:
          type: integer
          format: int32
        currentStage:
          type: string
        stageMessage:
          type: string
        created_by:
          type: string
        created_by_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        derived_status:
          type: string
        derived_status_display:
          type: string
        derived_status_description:
          type: string
        can_submit:
          type: boolean
        can_activate:
          type: boolean
        can_cancel:
          type: boolean
        can_update_due_date:
          type: boolean
        submit_blocker_reason:
          type: string
        activate_blocker_reason:
          type: string
        is_pushed_release:
          type: boolean
        auto_activation_mode:
          type: string
        scheduled_activation_at:
          type: string
          format: date-time
        last_auto_activation_attempt:
          type: string
          format: date-time
        auto_activation_failure_count:
          type: integer
          format: int32
        lsr_workflow_enabled:
          type: boolean
        lsr_gate_mode:
          type: string
        desired_due_date:
          type: string
          format: date
        foc_date:
          type: string
          format: date
        billing_name:
          type: string
        billing_street:
          type: string
        billing_floor:
          type: string
        billing_room_mail_stop:
          type: string
        billing_city:
          type: string
        billing_state:
          type: string
        billing_zip:
          type: string
        billing_account_number:
          type: string
        port_out_pin_set:
          type: boolean
        assignment:
          $ref: '#/components/schemas/ApplicationAssignmentIntentResponse'
    PagePortProjectResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/PortProjectResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
        empty:
          type: boolean
    RoutingData:
      type: object
      properties:
        currentLrn:
          type: string
        currentOcn:
          type: string
        npacRegion:
          type: string
      description: TN routing information
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    TnDetail:
      required:
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number
        accountNumber:
          type: string
          description: Account number for subscriber
        endUserName:
          type: string
          description: End user name
        streetNum:
          type: string
          description: Street number
        streetName:
          type: string
          description: Street name
        streetType:
          type: string
          description: Street type (St, Ave, Blvd, etc.)
        city:
          type: string
          description: City
        state:
          maxLength: 2
          minLength: 0
          type: string
          description: State (2-letter code)
        postalCode:
          maxLength: 10
          minLength: 0
          type: string
          description: Postal code
        pin:
          type: string
          description: PIN for authorization
        npacRegion:
          type: string
          description: NPAC region (auto-detected if not provided)
      description: Individual TN details for release
    TnLookupRequest:
      required:
      - tns
      type: object
      properties:
        tns:
          maxItems: 1000
          minItems: 0
          type: array
          description: List of 10-digit telephone numbers to lookup
          items:
            type: string
            description: List of 10-digit telephone numbers to lookup
      description: Request to lookup TNs for port-out release
    ApiCustomer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        email:
          type: string
        company:
          type: string
        isActive:
          type: boolean
        rateLimit:
          type: integer
          format: int32
        notes:
          type: string
        lastApiCall:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: object
        metadataDisplayConfig:
          type: array
          items:
            $ref: '#/components/schemas/MetadataDisplayColumn'
        respOrgEntityId:
          type: string
        respOrgId:
          type: string
        tollFreeEnabled:
          type: boolean
        tollFreeContactName:
          type: string
        tollFreeContactPhone:
          type: string
        tollFreeContactEmail:
          type: string
        customerSpids:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/CustomerSpid'
        activeSpids:
          uniqueItems: true
          type: array
          items:
            type: string
    CustomerSpid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/ApiCustomer'
        spid:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        ccna:
          type: string
        acna:
          type: string
        lsrName:
          type: string
        lsrStreet:
          type: string
        lsrCity:
          type: string
        lsrState:
          type: string
        lsrZip:
          type: string
        lsrContactPhone:
          type: string
        p2pCnpCarrierCode:
          type: string
        messagingAccountId:
          type: string
          format: uuid
    PortOutProjectCreateRequest:
      required:
      - customerId
      - gainingSpid
      - sourceSpid
      - tns
      type: object
      properties:
        customerId:
          type: string
          description: Customer UUID
          format: uuid
        sourceSpid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: Source SPID (our SPID releasing the numbers)
          example: 781K
        gainingSpid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: Gaining carrier SPID (receiving the numbers)
          example: '5678'
        name:
          maxLength: 255
          minLength: 0
          type: string
          description: Optional project name (auto-generated if not provided)
        tns:
          maxItems: 1000
          minItems: 0
          type: array
          description: List of TNs with subscriber data
          items:
            $ref: '#/components/schemas/TnDetail'
      description: Request to create a port-out release project
    PortProjectDetailResponse:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        tn:
          type: string
        lata:
          type: string
        current_lata_source:
          type: string
        gaining_lata_source:
          type: string
        state:
          type: string
        locality:
          type: string
        npac_region:
          type: string
        current_ocn:
          type: string
        current_lrn:
          type: string
        current_spid:
          type: string
        current_tandem:
          type: string
        current_tandem_name:
          type: string
        gaining_ocn:
          type: string
        gaining_lrn:
          type: string
        gaining_spid:
          type: string
        gaining_tandem:
          type: string
        gaining_tandem_name:
          type: string
        user_provided_lrn:
          type: string
        btn:
          type: string
        soa_status:
          type: string
        lsr_status:
          type: string
          enum:
          - NONE
          - SENDING
          - SENT
          - EBOND
          - FAILED
          - SKIPPED
          - UNRECOGNIZED
        csr_status:
          type: string
          enum:
          - NONE
          - SENT
          - EBOND
          - MANUAL_APPROVAL
        lsr_submitted_at:
          type: string
          format: date-time
        foc_date:
          type: string
          format: date
        lifecycle_state:
          type: string
        lifecycle_state_display:
          type: string
        lifecycle_status_display:
          $ref: '#/components/schemas/LifecycleStatusDisplay'
        can_activate:
          type: boolean
        can_activate_early:
