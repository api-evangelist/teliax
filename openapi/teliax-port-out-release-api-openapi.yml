        validationStatus:
          type: string
          enum:
          - PENDING
          - VALIDATING
          - VALID
          - ERROR
        validationErrors:
          type: object
          additionalProperties:
            type: object
        notes:
          type: object
          additionalProperties:
            type: object
        pushedDdd:
          type: string
          format: date
        isPushedRelease:
          type: boolean
        pushedReleaseEventId:
          type: string
          format: uuid
        detectedCarrierCode:
          type: string
        carrierOverride:
          type: string
        carrierDetectionSource:
          type: string
        endUserName:
          type: string
        businessName:
          type: string
        serviceAddress:
          type: string
        accountNumber:
          type: string
        pin:
          type: string
        btn:
          type: string
        streetNumber:
          type: string
        streetName:
          type: string
        streetType:
          type: string
        unit:
          type: string
        city:
          type: string
        serviceAddressState:
          type: string
        postalCode:
          type: string
        lsrSubmittedAt:
          type: string
          format: date-time
        lsrSubmissionMethod:
          type: string
        lsrConfirmationNumber:
          type: string
        lsrMetadata:
          type: object
          additionalProperties:
            type: object
        lsrFailedAt:
          type: string
          format: date-time
        lsrFailureReason:
          type: string
        lsrFailureCode:
          type: string
        lsrFailureInternalDetail:
          type: string
        lsrRetryCount:
          type: integer
          format: int32
        lsrLastRetryAt:
          type: string
          format: date-time
        csrReceivedAt:
          type: string
          format: date-time
        csrSource:
          type: string
        csrData:
          type: object
          additionalProperties:
            type: object
        csrDocumentUrl:
          type: string
        csrValidationStatus:
          type: string
        csrMatchConfidence:
          type: integer
          format: int32
        csrMismatchFields:
          type: object
          additionalProperties:
            type: object
        csrValidatedAt:
          type: string
          format: date-time
        csrValidatedBy:
          type: string
        supplementRequestedAt:
          type: string
          format: date-time
        supplementCount:
          type: integer
          format: int32
        csrAccountNumber:
          type: string
        csrBtn:
          type: string
        csrEndUserName:
          type: string
        csrServiceAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lifecycleStatusDisplay:
          $ref: '#/components/schemas/LifecycleStatusDisplay'
        carrierReleaseRecovery:
          $ref: '#/components/schemas/CarrierReleaseRecoveryProjection'
    PagePortProjectDetailResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/PortProjectDetailResponse'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        pageable:
          $ref: '#/components/schemas/PageableObject'
        last:
          type: boolean
        empty:
