openapi: 3.2.0
info:
  title: TNIQ by Ringer — Customer Port-Out Release API
  description: External API for TNIQ customers.
  contact:
    name: Ringer API Support
    url: https://ringer.tel
    email: api-support@ringer.tel
  version: v1
servers:
- url: https://api.tniq.ringer.tel
  description: Production
- url: https://tniq-api.ringer.tel
  description: Production (legacy alias)
- url: https://staging-api.ringer.tel
  description: Staging
tags:
- name: Port-Out Release
  description: Port-out release project management for NPAC releases
paths:
  /v1/port-out-releases/projects/{projectId}/details/{tn}:
    put:
      tags:
      - Port-Out Release
      summary: Update TN details in a port-out release project
      description: Updates subscriber data for a TN (for manual entry when not in inventory)
      operationId: updateDetail
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tn
        in: path
        required: true
        schema:
          type: string
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortProjectDetail'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortProjectDetailResponse'
  /v1/port-out-releases/projects:
    get:
      tags:
      - Port-Out Release
      summary: Get port-out release projects
      description: Returns all port-out release projects for the specified customer
      operationId: getProjects_1
      parameters:
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagePortProjectResponse'
    post:
      tags:
      - Port-Out Release
      summary: Create a port-out release project
      description: Creates a project with LOSING direction for releasing TNs to NPAC
      operationId: createProject_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortOutProjectCreateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortProjectResponse'
  /v1/port-out-releases/projects/{projectId}/submit:
    post:
      tags:
      - Port-Out Release
      summary: Submit port-out releases to NPAC
      description: Submits soareleaseport for all TNs in the project
      operationId: submitProject_1
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: dueDate
        in: query
        description: Due date in MM/dd/yyyy format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubmitResultResponse'
  /v1/port-out-releases/projects/{projectId}/retry:
    post:
      tags:
      - Port-Out Release
      summary: Retry failed TNs in a port-out release project
      description: Retries soareleaseport for TNs that previously failed
      operationId: retryFailedTns
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: dueDate
        in: query
        description: Due date in MM/dd/yyyy format
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubmitResultResponse'
  /v1/port-out-releases/lookup:
    post:
      tags:
      - Port-Out Release
      summary: Lookup TNs for port-out release
      description: Checks inventory and Telique to gather SPID info and subscriber data for release
      operationId: lookupTns
      parameters:
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TnLookupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TnLookupResponse'
  /v1/port-out-releases/projects/{projectId}:
    get:
      tags:
      - Port-Out Release
      summary: Get a port-out release project
      description: Returns details of a specific port-out release project
      operationId: getProject_2
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PortProjectResponse'
  /v1/port-out-releases/projects/{projectId}/details:
    get:
      tags:
      - Port-Out Release
      summary: Get TNs in a port-out release project
      description: Returns all TNs with their details for a port-out release project
      operationId: getProjectDetails_2
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: customerId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagePortProjectDetailResponse'
components:
