components:
  schemas:
    ProtectionDecision:
      type: object
      properties:
        action:
          type: string
          enum:
          - BLOCK
          - ALLOW
          - REQUIRE_APPROVAL
          - REQUIRE_PIN
          - HOLD_PERIOD
        matchedRuleId:
          type: string
          format: uuid
        matchedScope:
          type: string
          enum:
          - CUSTOMER
          - SPID
          - TN
        reason:
          type: string
        holdPeriodHours:
          type: integer
          format: int32
    CreateRuleRequest:
      required:
      - action
      - scope
      type: object
      properties:
        scope:
          type: string
          enum:
          - CUSTOMER
          - SPID
          - TN
        target:
          maxLength: 32
          minLength: 0
          type: string
        action:
          type: string
          enum:
          - BLOCK
          - ALLOW
          - REQUIRE_APPROVAL
          - REQUIRE_PIN
          - HOLD_PERIOD
        holdPeriodHours:
          maximum: 168
          minimum: 1
          type: integer
          format: int32
        pin:
          maxLength: 255
          minLength: 0
          type: string
        reason:
          maxLength: 4000
          minLength: 0
          type: string
        expiresAt:
          type: string
          format: date-time
    EffectivePolicyResponse:
      type: object
      properties:
        tn:
          type: string
        decision:
          $ref: '#/components/schemas/ProtectionDecision'
    UpdateRuleRequest:
      required:
      - action
      type: object
      properties:
        action:
          type: string
          enum:
          - BLOCK
          - ALLOW
          - REQUIRE_APPROVAL
          - REQUIRE_PIN
          - HOLD_PERIOD
        holdPeriodHours:
          maximum: 168
          minimum: 1
          type: integer
          format: int32
        reason:
          maxLength: 4000
          minLength: 0
          type: string
        expiresAt:
          type: string
          format: date-time
    PortProtectionRuleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        scope:
          type: string
          enum:
          - CUSTOMER
          - SPID
          - TN
        target:
          type: string
        action:
          type: string
          enum:
          - BLOCK
          - ALLOW
          - REQUIRE_APPROVAL
          - REQUIRE_PIN
          - HOLD_PERIOD
        holdPeriodHours:
          type: integer
          format: int32
        reason:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        systemManaged:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Bearer token authentication. Pass your API token or user JWT in the Authorization header: Authorization: Bearer YOUR_TOKEN'
      scheme: bearer
      bearerFormat: JWT
