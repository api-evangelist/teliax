components:
  schemas:
    RocSubmitRequest:
      required:
      - respOrgId
      type: object
      properties:
        respOrgId:
          type: string
        contactInformation:
          type: string
    TfnActionDto:
      required:
      - actionCode
      - tfn
      type: object
      properties:
        tfn:
          type: string
        actionCode:
          type: string
        rejectNote:
          type: string
    RocLoaGenerateRequest:
      required:
      - address1
      - city
      - contactName
      - contactPhone
      - contactTitle
      - custName
      - respOrgId
      - state
      - zipCode
      type: object
      properties:
        respOrgId:
          type: string
        custName:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        contactName:
          type: string
        contactTitle:
          type: string
        contactPhone:
          type: string
        email:
          type: string
    RocCreateRequest:
      required:
      - entityId
      - newRespOrgId
      - requestType
      - tfns
      type: object
      properties:
        entityId:
          type: string
        newRespOrgId:
          pattern: ^[a-zA-Z0-9]{5}$
          type: string
        requestType:
          type: string
        tfns:
          type: array
          items:
            pattern: ^[0-9]{10}$
            type: string
        effectiveDate:
          type: string
          format: date
        notes:
          maxLength: 1000
          minLength: 0
          type: string
    RocProcessRequest:
      required:
      - actions
      - respOrgId
      type: object
      properties:
        respOrgId:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/TfnActionDto'
    RocSyncRequest:
      required:
      - customerId
      - direction
      - endDate
      - respOrgId
      - startDate
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        respOrgId:
          type: string
        direction:
          type: string
        startDate:
          type: string
        endDate:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Bearer token authentication. Pass your API token or user JWT in the Authorization header: Authorization: Bearer YOUR_TOKEN'
      scheme: bearer
      bearerFormat: JWT
