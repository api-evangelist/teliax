openapi: 3.2.0
info:
  title: TNIQ by Ringer — Customer SOA Operations API
  description: External API for TNIQ customers.
  contact:
    name: Ringer API Support
    url: https://ringer.tel
    email: api-support@ringer.tel
  version: v1
servers:
- url: https://api.tniq.ringer.tel
  description: Production
- url: https://tniq-api.ringer.tel
  description: Production (legacy alias)
- url: https://staging-api.ringer.tel
  description: Staging
tags:
- name: SOA Operations
  description: Service Order Administration endpoints for Local Number Portability
paths:
  /v1/lnp/soa/release:
    post:
      tags:
      - SOA Operations
      summary: Release a port request
      description: Releases a telephone number from a port request
      operationId: release
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaReleaseRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaReleaseRequest'
        required: true
      responses:
        '200':
          description: Release successful
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '404':
          description: Port request not found
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
      security:
      - bearerAuth: []
  /v1/lnp/soa/lrn/remove:
    post:
      tags:
      - SOA Operations
      summary: Remove an LRN
      description: Removes an existing Local Routing Number
      operationId: removeLrn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaLrnRemoveRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaLrnRemoveRequest'
        required: true
      responses:
        '200':
          description: LRN removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '404':
          description: LRN not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/lrn/create:
    post:
      tags:
      - SOA Operations
      summary: Create an LRN
      description: Creates a new Local Routing Number
      operationId: createLrn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaLrnCreateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaLrnCreateRequest'
        required: true
      responses:
        '201':
          description: LRN created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '409':
          description: LRN already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/intrasp:
    post:
      tags:
      - SOA Operations
      summary: IntraSP transfer
      description: Performs an intra-service provider number portability transfer, updating the LRN without a full port order
      operationId: intraSp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaIntraSpRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaIntraSpRequest'
        required: true
      responses:
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '200':
          description: IntraSP transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Pre-flight validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/events/{recno}/acknowledge:
    post:
      tags:
      - SOA Operations
      summary: Acknowledge an event
      description: Acknowledges a specific SOA event by record number
      operationId: acknowledgeEvent
      parameters:
      - name: recno
        in: path
        description: Record number of the event to acknowledge
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Event acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/disconnect:
    post:
      tags:
      - SOA Operations
      summary: Disconnect a number
      description: Disconnects a telephone number from service
      operationId: disconnect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaDisconnectRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaDisconnectRequest'
        required: true
      responses:
        '200':
          description: Disconnection successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
