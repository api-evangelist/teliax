    SoaActivateRequest:
      required:
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number to activate
          example: '2125551234'
        newspid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: 4-character gaining SPID (optional)
          example: '1234'
        region:
          maxLength: 4
          type: string
          description: 4-character region ID (optional)
          example: EAST
