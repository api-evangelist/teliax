                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/create:
    post:
      tags:
      - SOA Operations
      summary: Create a new port request [DEPRECATED]
      description: 'DEPRECATED: Use Port Orders system instead (POST /v1/port-projects/projects). This endpoint will be removed in v3.0.0.'
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaCreateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaCreateRequest'
        required: true
      responses:
        '410':
          description: Gone - Use Port Orders system
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: object
      deprecated: true
      security:
      - bearerAuth: []
  /v1/lnp/soa/conflict/remove:
    post:
      tags:
      - SOA Operations
      summary: Remove a conflict
      description: Removes a telephone number from conflict status
      operationId: removeConflict
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaConflictRemoveRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaConflictRemoveRequest'
        required: true
      responses:
        '200':
          description: Conflict removed successfully
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
      security:
      - bearerAuth: []
  /v1/lnp/soa/conflict/create:
    post:
      tags:
      - SOA Operations
      summary: Create a conflict
      description: Places a telephone number into conflict status
      operationId: createConflict
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaConflictCreateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaConflictCreateRequest'
        required: true
      responses:
        '200':
          description: Conflict created successfully
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
      security:
      - bearerAuth: []
  /v1/lnp/soa/cancel:
    post:
      tags:
      - SOA Operations
      summary: Cancel a port request
      description: Cancels an existing port request for a telephone number
      operationId: cancel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaCancelRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaCancelRequest'
        required: true
      responses:
        '200':
          description: Cancellation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '404':
          description: Port request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/activate:
    post:
      tags:
      - SOA Operations
      summary: Activate a ported number
      description: Activates a telephone number that has been ported
      operationId: activate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SoaActivateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/SoaActivateRequest'
        required: true
      responses:
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '200':
          description: Activation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
