    SoaDisconnectRequest:
      required:
      - spid
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number
          example: '2125551234'
        spid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: 4-character current SPID
          example: '1234'
        region:
          maxLength: 4
          type: string
          description: 4-character region ID (optional)
          example: EAST
      description: Request to disconnect a telephone number
    SoaLrnRemoveRequest:
      required:
      - newspid
      - region
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit LRN to remove
          example: '2125550000'
        newspid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: 4-character gaining SPID
          example: '1234'
        region:
          maxLength: 4
          type: string
          description: 4-character region ID
          example: EAST
      description: Request to remove an LRN
    SoaConflictCreateRequest:
      required:
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number
          example: '2125551234'
      description: Request to create a conflict for a telephone number
    SoaCreateRequest:
      required:
      - lrn
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number to port
          example: '2125551234'
        lrn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit Location Routing Number
          example: '2125550000'
        newspid:
          type: string
          description: 4-character gaining SPID (auto-detected from target LRN if not provided)
          example: '1234'
        oldspid:
          type: string
          description: 4-character losing SPID (auto-detected from current TN if not provided)
          example: '5678'
        ddd:
          type: string
          description: Port due date in ISO instant format (auto-set to tomorrow midnight UTC if not provided)
          example: '2025-11-07T05:00:00.000Z'
        region:
          maxLength: 4
          type: string
          description: 4-character region ID (optional)
          example: EAST
      description: Request to create a new port order
    SoaConflictRemoveRequest:
      required:
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number
          example: '2125551234'
      description: Request to remove a conflict from a telephone number
    SoaIntraSpRequest:
      required:
      - lrn
      - newspid
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit telephone number
          example: '2125551234'
        lrn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit LRN
          example: '2125550000'
        newspid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: 4-character gaining SPID
          example: '1234'
