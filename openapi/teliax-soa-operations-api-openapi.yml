            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/status/{tn}:
    get:
      tags:
      - SOA Operations
      summary: Get number status
      description: Gets the current status of a telephone number
      operationId: getStatus
      parameters:
      - name: tn
        in: path
        description: 10-digit telephone number
        required: true
        schema:
          type: string
        example: 2125551234
      responses:
        '404':
          description: Number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaStatusResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/spid/{tn}:
    get:
      tags:
      - SOA Operations
      summary: Get SPID for number
      description: Gets the current SPID information for a telephone number
      operationId: getSpid
      parameters:
      - name: tn
        in: path
        description: 10-digit telephone number
        required: true
        schema:
          type: string
        example: 2125551234
      responses:
        '404':
          description: Number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
        '200':
          description: SPID retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaSpidResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/query/{tn}:
    get:
      tags:
      - SOA Operations
      summary: Query port status
      description: Queries the current status and details of a telephone number
      operationId: query
      parameters:
      - name: tn
        in: path
        description: 10-digit telephone number
        required: true
        schema:
          type: string
        example: 2125551234
      - name: newspid
        in: query
        description: 4-character SPID
        required: false
        schema:
          type: string
        example: 1234
      - name: region
        in: query
        description: 4-character region ID
        required: false
        schema:
          type: string
        example: EAST
      responses:
        '404':
          description: Number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaQueryResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/events:
    get:
      tags:
      - SOA Operations
      summary: Get SOA events
      description: Retrieves unacknowledged SOA events
      operationId: getEvents
      responses:
        '200':
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaEventsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaEventsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaEventsResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaEventsResponse'
      security:
      - bearerAuth: []
  /v1/lnp/soa/activation-ready/{newspid}:
    get:
      tags:
      - SOA Operations
      summary: Get activation-ready numbers
      description: Gets all numbers ready for activation for a specific SPID
      operationId: getActivationReady
      parameters:
      - name: newspid
        in: path
        description: 4-character new SPID
        required: true
        schema:
          type: string
        example: 1234
      responses:
        '403':
          description: SPID not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
        '200':
          description: Numbers retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/SoaActReadyResponse'
      security:
      - bearerAuth: []
components:
  schemas:
    SoaLrnCreateRequest:
      required:
      - newspid
      - region
      - tn
      type: object
      properties:
        tn:
          pattern: ^[0-9]{10}$
          type: string
          description: 10-digit LRN to create
          example: '2125550000'
        newspid:
          pattern: ^[0-9A-Z]{4}$
          type: string
          description: 4-character gaining SPID
          example: '1234'
        region:
          maxLength: 4
          type: string
          description: 4-character region ID
          example: EAST
      description: Request to create an LRN
    SoaActReadyResponse:
      type: object
      properties:
        timestamp:
          type: string
          description: Response timestamp
          format: date-time
          example: '2024-12-27T10:30:00Z'
        status:
          type: string
          description: Operation status
          example: SUCCESS
        spid:
          type: string
          description: SPID
          example: 616J
        readyCount:
          type: integer
          description: Number of ports ready for activation
          format: int32
        readyNumbers:
          type: array
          description: List of telephone numbers ready for activation
          items:
            type: string
            description: List of telephone numbers ready for activation
        error:
          type: string
          description: Error message if status is ERROR
        readyTns:
          type: array
          items:
            type: string
        dataSource:
          type: string
      description: SOA activation ready response
    SoaQueryResponse:
      type: object
      properties:
        timestamp:
          type: string
          description: Response timestamp
          format: date-time
          example: '2024-12-27T10:30:00Z'
        status:
          type: string
          description: Operation status
          example: SUCCESS
        tn:
          type: string
          description: Telephone number
          example: '3036298301'
        currentSpid:
          type: string
          description: Current SPID
          example: 567G
        lrn:
          type: string
          description: Location Routing Number
          example: '7207081999'
        portStatus:
          type: string
          description: Port status
          example: PENDING
        subscriptionVersionState:
          type: string
          description: AstroSOA subscription-version state
          example: VSAC
        newSpDueDate:
          type: string
          description: New service provider due date from the subscription version
        oldSpDueDate:
          type: string
          description: Old service provider due date from the subscription version
        oldSpAuthorization:
          type: string
          description: Old service provider authorization
          example: Released
        createTimestamp:
          type: string
          description: Subscription-version create timestamp
        lnpType:
