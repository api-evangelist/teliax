openapi: 3.2.0
info:
  title: TNIQ by Ringer — Customer TCR Webhooks API
  description: External API for TNIQ customers.
  contact:
    name: Ringer API Support
    url: https://ringer.tel
    email: api-support@ringer.tel
  version: v1
servers:
- url: https://api.tniq.ringer.tel
  description: Production
- url: https://tniq-api.ringer.tel
  description: Production (legacy alias)
- url: https://staging-api.ringer.tel
  description: Staging
tags:
- name: TCR Webhooks
  description: TCR webhook event receiver and event history
paths:
  /v1/messaging/webhooks/test/{eventType}:
    post:
      tags:
      - TCR Webhooks
      summary: Send mock webhook
      description: Triggers TCR to send a mock webhook event to our registered endpoint
      operationId: sendMockWebhook
      parameters:
      - name: eventType
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/messaging/webhooks/subscriptions:
    get:
      tags:
      - TCR Webhooks
      summary: List webhook subscriptions
      description: Returns current TCR webhook subscriptions with registered URLs
      operationId: listSubscriptions
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/messaging/webhooks/event-types:
    get:
      tags:
      - TCR Webhooks
      summary: List webhook event types
      description: Returns all available TCR webhook event types
      operationId: listEventTypes
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/messaging/campaigns/{campaignId}/events:
    get:
      tags:
      - TCR Webhooks
      summary: Campaign event history
      description: Returns TCR webhook events for a campaign
      operationId: getCampaignEvents
      parameters:
      - name: campaignId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /v1/messaging/brands/{brandId}/events:
    get:
      tags:
      - TCR Webhooks
      summary: Brand event history
      description: Returns TCR webhook events for a brand
      operationId: getBrandEvents
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      description: 'Bearer token authentication. Pass your API token or user JWT in the Authorization header: Authorization: Bearer YOUR_TOKEN'
      scheme: bearer
      bearerFormat: JWT
