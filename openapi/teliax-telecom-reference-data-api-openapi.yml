          type: string
        customerType:
          type: string
        contactType:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        primaryPhone:
          type: string
        secondaryPhone:
          type: string
        regions:
          type: array
          items:
            type: string
    SpidResolveResponse:
      type: object
      properties:
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SpidResolutionDto'
        dataset:
          $ref: '#/components/schemas/NpacSpidDatasetFreshnessDto'
    RespOrgResolutionDto:
