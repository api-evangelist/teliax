description: WARP API keys (Bearer rk_...) and portal roles carry scopes from a platform scope registry (GET /v1/scopes). These are API-key / RBAC scopes, not OAuth2 scopes; no OAuth2 securityScheme is declared in any of the three contracts. Each scope below is named in a "Required scopes" block on a WARP guide page; the contract tags numbers:read and numbers:write via x-required-scopes. TNIQ docs say tokens "are scoped per-customer and support operation-level restrictions" but publish no scope names. Telique uses a single x-api-token with no scopes.
schemes:
- name: ApiKeyAuth
  type: apiKey
  api: WARP Customer API
  notes: Scopes are selected when a key is created in the portal under Settings → API Keys.
scopes:
- {scope: 'team:read', description: View team members and roles., docs: https://warp.ringer.tel/docs/guides/team-roles-api-keys-security}
- {scope: 'team:write', description: Change a member's role, remove members, create/update/delete/duplicate roles., docs: https://warp.ringer.tel/docs/guides/team-roles-api-keys-security}
- {scope: 'api_keys:read', description: List keys, view prefixes and inspect audit entries., docs: https://warp.ringer.tel/docs/guides/team-roles-api-keys-security}
- {scope: 'api_keys:write', description: Create, rotate or revoke keys (step-up verification required)., docs: https://warp.ringer.tel/docs/guides/team-roles-api-keys-security}
